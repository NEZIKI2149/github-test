<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b22"><title>スマホC++エディタ | ネジキチートシート</title>
<style>
:root{color-scheme:dark;--bg:#151b22;--panel:#1c242d;--code:#131a22;--ink:#e5ebf2;--sub:#a7b3c1;--line:#35414e;--accent:#73d9c4;--key:#303b49;--special:#405263;--on:#2a655d;--kh:clamp(25px,8.1dvh,41px);--gap:3px}
:root[data-theme=light]{color-scheme:light;--bg:#f7f8fa;--panel:#fff;--code:#f2f5f8;--ink:#202c38;--sub:#586979;--line:#cbd6df;--accent:#087c72;--key:#e3eaf0;--special:#cad9e2;--on:#d2eae3}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic UI",Meiryo,sans-serif}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) max(7px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));gap:5px}
.toolbar{display:flex;align-items:center;gap:5px;flex-shrink:0;min-height:35px}.toolbar a{font-size:12px;color:var(--sub);text-decoration:none;white-space:nowrap;padding:5px}.filename{font-weight:700;font-size:12px;margin-right:auto;white-space:nowrap}
.toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;font-size:12px;min-height:30px}.toolbar button.primary{background:var(--on);border-color:var(--accent)}
.category-tabs{display:flex;align-items:stretch;gap:18px;width:100%;flex:0 0 auto;min-height:32px;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--line)}
.category-tabs::-webkit-scrollbar{display:none}
.category-tabs a{display:flex;align-items:center;flex:0 0 auto;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:12px;font-weight:650;border-bottom:3px solid transparent;padding:4px 0 6px}
.category-tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.category-tabs a:hover{color:var(--accent)}
#editor{display:block;flex:1 1 0;min-height:56px;width:100%;resize:none;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 12px;outline:none;caret-color:var(--accent);font:13px/1.5 "SFMono-Regular",Consolas,monospace;white-space:pre;tab-size:4;overflow:auto;-webkit-overflow-scrolling:touch;-webkit-text-size-adjust:100%;font-variant-ligatures:none}#editor:focus{border-color:var(--accent)}#editor::selection{background:rgba(115,217,196,.4)}
.hint{font-size:10px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:12px;padding:0 3px;flex-shrink:0}
.keyboard{display:flex;gap:6px;flex-shrink:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.keyboard-viewport{flex:1;min-width:0;overflow:hidden}.keyboard-main{width:100%;display:flex;flex-direction:column;gap:var(--gap);min-width:0}.key-row{display:flex;gap:var(--gap);height:var(--kh);min-width:0;position:relative}
.key{flex:var(--w,1) 1 0;min-width:0;height:var(--kh);padding:1px;border:1px solid var(--line);border-radius:5px;background:var(--key);font-size:clamp(9px,1.6dvw,13px);font-weight:650;line-height:1.05;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;-webkit-tap-highlight-color:transparent}.key .upper{font-size:8px;line-height:1;color:var(--sub);margin-bottom:2px}.key.special{background:var(--special);font-size:clamp(8px,1.3dvw,11px)}.key.pressed,.key:active{background:var(--on);border-color:var(--accent)}.key.enter{height:calc(var(--kh)*2 + var(--gap));position:relative;z-index:2;font-size:14px}.key.empty{visibility:hidden;pointer-events:none}
.arrows{flex:0 0 clamp(80px,13vw,115px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,var(--kh));gap:var(--gap)}.arrows .key{width:100%;font-size:14px}.up{grid-area:4/2}.left{grid-area:5/1}.down{grid-area:5/2}.right{grid-area:5/3}
.toast{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#183638;color:white;border:1px solid #497d75;border-radius:6px;padding:7px 12px;font-size:12px;max-width:85vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}
.kb-navigation{display:none}
@media (orientation:portrait) and (max-width:750px){
:root{--kh:clamp(39px,5.7dvh,49px);--gap:4px}
#app{gap:6px}
.toolbar{min-height:35px;flex-wrap:wrap;justify-content:flex-end}
.toolbar a{margin-right:auto}
#editor{min-height:110px;font-size:13px}
.hint{font-size:10px}
.hint span:last-child{font-size:9px}
.keyboard{flex-direction:column;gap:6px}
.keyboard-viewport{width:100%;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.keyboard-main{width:max(650px,100%);min-width:650px}
.key{font-size:12px;border-radius:6px}
.key.special{font-size:10px}
.key .upper{font-size:9px}
.arrows{flex:0 0 auto;width:100%;height:82px;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,39px);justify-content:center;gap:4px}
.arrows .key{height:39px;width:56px;font-size:18px}
.kb-navigation{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--sub);font-size:10px;flex-shrink:0;min-height:29px}
.kb-navigation .pan-buttons{display:flex;gap:4px}
.kb-navigation button{background:var(--panel);color:var(--ink);font-size:11px;min-height:29px;border:1px solid var(--line);border-radius:5px;padding:4px 8px}
.kb-navigation button[aria-pressed=true]{border-color:var(--accent);background:var(--on)}
#app.fit-keys .keyboard-main{width:100%;min-width:100%}
#app.fit-keys .keyboard-viewport{overflow-x:hidden}
#app.fit-keys .key{font-size:8px;letter-spacing:-.2px;border-radius:3px}
#app.fit-keys .key.special{font-size:7px}
#app.fit-keys .key .upper{font-size:7px;margin-bottom:1px}
#app.fit-keys .key-row{gap:2px}
#app.fit-keys .keyboard-main{gap:2px}
}
@media (orientation:portrait) and (max-height:650px){:root{--kh:36px}.arrows{height:66px;grid-template-rows:repeat(2,31px)}.arrows .key{height:31px}.kb-navigation{min-height:26px}.kb-navigation button{min-height:26px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-height:335px) and (orientation:landscape){:root{--kh:clamp(22px,7.5dvh,29px)}#editor{font-size:12px;padding:6px 8px}.hint{font-size:9px}.toolbar{min-height:29px}.toolbar button{min-height:26px;padding:4px 7px}}
@media (max-width:650px) and (orientation:landscape){:root{--gap:2px}.keyboard{gap:3px}.arrows{flex-basis:78px}.toolbar button{padding:4px 6px}}
</style></head>
<body><div id="app">
<div class="toolbar"><a href="./#algo" aria-label="リファレンスに戻る">‹ リファレンス</a><span class="filename">main.cpp</span><button id="new" type="button">新規</button><button id="undo" type="button" aria-label="元に戻す">↶</button><button id="redo" type="button" aria-label="やり直す">↷</button><button id="paste" class="primary" type="button">貼り付け</button><button id="copy" class="primary" type="button">コピー</button></div>
<nav class="category-tabs" id="category-tabs" aria-label="カテゴリ"><a href="./#std">標準ライブラリ</a><a href="./#acl">AtCoder Library</a><a href="./#algo">アルゴリズム</a><a href="./#limits">計算量・メモリ</a><a href="mobile-editor.html" aria-current="page">スマホエディタ</a><a href="./#notes">更新履歴・メモ</a></nav>
<textarea id="editor" readonly inputmode="none" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="C++コード。下の画面キーボードで編集"></textarea>
<div class="hint"><span id="status">自動保存 · C++23</span><span>Ctrl+A 全選択 · Shift+矢印 範囲選択</span></div>
<div class="kb-navigation" aria-label="縦画面のキーボード表示"><span>JIS配列 · 左右にスワイプ</span><div class="pan-buttons"><button id="pan-left" type="button" aria-label="キーボードの左側を表示">◀ 左</button><button id="fit-keys" type="button" aria-pressed="false">全体表示</button><button id="pan-right" type="button" aria-label="キーボードの右側を表示">右 ▶</button></div></div>
<div class="keyboard" id="keyboard" aria-label="JIS配列キーボード"><div class="keyboard-viewport" id="keyboard-viewport"><div id="keyboard-main" class="keyboard-main"></div></div><div id="arrows" class="arrows"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
(function(){
const TEMPLATE="#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    \n}";
const KEY="neziki-cpp-mobile-editor-v1";
// カテゴリ移動時も同一オリジンの保存領域にコードと選択状態を保持する。
const categoryTabs=document.getElementById("category-tabs");
const currentCategory=categoryTabs.querySelector('[aria-current="page"]');
function keepCurrentCategoryVisible(){
  if(!currentCategory)return;
  const outer=categoryTabs.getBoundingClientRect(),inner=currentCategory.getBoundingClientRect();
  categoryTabs.scrollLeft+=inner.left-outer.left-(outer.width-inner.width)/2;
}
requestAnimationFrame(keepCurrentCategoryVisible);
const editor=document.getElementById("editor"),status=document.getElementById("status"),toast=document.getElementById("toast"),main=document.getElementById("keyboard-main"),arrows=document.getElementById("arrows");
let code=TEMPLATE,anchor=TEMPLATE.indexOf("\n    \n")+5,head=anchor,shift=0,ctrl=false,lastShift=0,timer=null;
const undo=[],redo=[];
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.code==="string"){code=v.code;anchor=Math.min(code.length,Math.max(0,Number(v.anchor)||0));head=Math.min(code.length,Math.max(0,Number(v.head)||0));}}catch(_){}
function snap(){return {code:code,anchor:anchor,head:head};}
function notice(t){toast.textContent=t;toast.classList.add("show");clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove("show");},2400);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(snap()));}catch(_){status.textContent="自動保存できません";}}
window.addEventListener("pagehide",save);
categoryTabs.addEventListener("click",function(){save();});
function render(){
  editor.value=code;
  try{editor.setSelectionRange(Math.min(anchor,head),Math.max(anchor,head),head<anchor?"backward":"forward");}catch(_){}
  status.textContent="自動保存 · "+code.slice(0,head).split("\n").length+"行目";
  document.querySelectorAll(".key.toggle").forEach(function(el){const on=(el.dataset.op==="shift"&&shift>0)||(el.dataset.op==="ctrl"&&ctrl);el.classList.toggle("pressed",on);el.setAttribute("aria-pressed",String(on));});
  save();
}
function record(){undo.push(snap());if(undo.length>150)undo.shift();redo.length=0;}
function replace(t,s,e){s=s===undefined?Math.min(anchor,head):s;e=e===undefined?Math.max(anchor,head):e;if(s===e&&!t)return;record();code=code.slice(0,s)+t+code.slice(e);anchor=head=s+t.length;render();}
function backspace(){const s=Math.min(anchor,head),e=Math.max(anchor,head);if(s!==e){replace("");return;}if(!head)return;const c=Array.from(code.slice(0,head)).pop();replace("",head-c.length,head);}
function history(forward){const from=forward?redo:undo,to=forward?undo:redo;if(!from.length)return;to.push(snap());const v=from.pop();code=v.code;anchor=v.anchor;head=v.head;render();}
function readSelection(){const a=editor.selectionStart,b=editor.selectionEnd;if(typeof a!=="number")return;if(editor.selectionDirection==="backward"){anchor=b;head=a;}else{anchor=a;head=b;}save();}
editor.addEventListener("select",readSelection);editor.addEventListener("pointerup",function(){setTimeout(readSelection,0);});editor.addEventListener("click",function(){setTimeout(readSelection,0);});
function vertical(p,d){const start=code.lastIndexOf("\n",p-1)+1,col=p-start;if(d==="up"){if(!start)return 0;const end=start-1,prev=code.lastIndexOf("\n",end-1)+1;return Math.min(prev+col,end);}const end=code.indexOf("\n",p);if(end<0)return code.length;const next=end+1,last=code.indexOf("\n",next);return Math.min(next+col,last<0?code.length:last);}
function move(d){let p=head;if(!shift&&anchor!==head&&(d==="left"||d==="right"))p=d==="left"?Math.min(anchor,head):Math.max(anchor,head);else if(d==="left")p=Math.max(0,p-1);else if(d==="right")p=Math.min(code.length,p+1);else p=vertical(p,d);if(!shift)anchor=p;head=p;ctrl=false;render();editor.focus({preventScroll:true});}
function insert(t){replace(t);if(shift===1)shift=0;render();}
function enter(){const start=code.lastIndexOf("\n",Math.min(anchor,head)-1)+1;const before=code.slice(start,Math.min(anchor,head));const indent=(before.match(/^[ \t]*/)||[""])[0];insert("\n"+indent+(/\{\s*$/.test(before)?"    ":""));}
function btn(label,val,upper,w,op){const b=document.createElement("button");b.type="button";b.className="key"+(op?" special":"")+(op==="shift"||op==="ctrl"?" toggle":"")+(op==="enter"?" enter":"");b.style.setProperty("--w",w||1);b.dataset.op=op||"char";if(val!==undefined)b.dataset.value=val;if(upper!==undefined)b.dataset.shift=upper;
if(upper&&upper!==val&&!op){const t=document.createElement("span");t.className="upper";t.textContent=upper;b.appendChild(t);}const t=document.createElement("span");t.textContent=label;b.appendChild(t);b.setAttribute("aria-label",label);return b;}
function sp(label,op,w){return btn(label,undefined,undefined,w,op);}function ch(v,u,l){return btn(l||v,v,u,1);}
function blank(w){const b=document.createElement("div");b.className="key empty";b.style.setProperty("--w",w);return b;}
const rows=[
[sp("半/全","ime",1.6),...[["1","!"],["2",'"'],["3","#"],["4","$"],["5","%"],["6","&"],["7","'"],["8","("],["9",")"],["0","0"],["-","="],["^","~"],["¥","|"]].map(function(k){return ch(k[0]==="¥"?"\\":k[0],k[1],k[0]);}),sp("⌫","backspace",2.4)],
[sp("Tab","tab",2.5),..."QWERTYUIOP".split("").map(function(x){return ch(x.toLowerCase(),x);}),ch("@",String.fromCharCode(96)),ch("[","{"),blank(2.5)],
[blank(2),..."ASDFGHJKL".split("").map(function(x){return ch(x.toLowerCase(),x);}),ch(";","+"),ch(":","*"),ch("]","}"),sp("Enter","enter",3)],
[sp("Shift","shift",2),..."ZXCVBNM".split("").map(function(x){return ch(x.toLowerCase(),x);}),ch(",","<"),ch(".",">"),ch("/","?"),ch("\\","_","ろ"),blank(4)],
[sp("Ctrl","ctrl",2.8),sp("無変換","ime",2),sp("Space","space",5.9),sp("変換","ime",2),sp("かな","ime",1.8),sp("Ctrl","ctrl",2.5)]
];
rows.forEach(function(keys,i){const row=document.createElement("div");row.className="key-row row-"+i;keys.forEach(function(key){row.appendChild(key);});main.appendChild(row);});
[["↑","up","up"],["←","left","left"],["↓","down","down"],["→","right","right"]].forEach(function(r){const b=sp(r[0],"arrow",1);b.dataset.direction=r[1];b.classList.add(r[2]);arrows.appendChild(b);});
async function copy(t){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error();await navigator.clipboard.writeText(t);notice("コピーしました");return true;}catch(_){notice("コピーできません。ブラウザの権限を確認してください");return false;}}
async function paste(){const s=Math.min(anchor,head),e=Math.max(anchor,head);try{if(!navigator.clipboard||!navigator.clipboard.readText)throw Error();const t=await navigator.clipboard.readText();if(!t){notice("クリップボードにテキストがありません");return;}replace(t,s,e);notice(s!==e?"選択範囲を置換しました":"貼り付けました");}catch(_){notice("貼り付けできません。Safariの貼り付け許可を確認してください");}}
async function shortcut(k){switch(k){
case "a":anchor=0;head=code.length;render();notice("すべて選択しました");break;
case "c":if(anchor!==head)await copy(code.slice(Math.min(anchor,head),Math.max(anchor,head)));else notice("範囲を選択してください");break;
case "x":if(anchor!==head){const s=Math.min(anchor,head),e=Math.max(anchor,head);if(await copy(code.slice(s,e)))replace("",s,e);}else notice("範囲を選択してください");break;
case "v":await paste();break;
case "z":history(shift>0);break;
case "y":history(true);break;
default:notice("Ctrl+"+k.toUpperCase()+" は未対応です");
}ctrl=false;if(shift===1)shift=0;render();}
function press(b){const op=b.dataset.op;if(op==="shift"){const now=Date.now();shift=shift===2?0:shift===1?(now-lastShift<500?2:0):1;lastShift=now;render();return;}if(op==="ctrl"){ctrl=!ctrl;render();return;}if(op==="arrow"){move(b.dataset.direction);return;}if(op==="ime"){notice("C++の半角入力に固定しています");return;}if(op==="backspace"){backspace();return;}if(op==="enter"){enter();return;}if(op==="tab"){insert("    ");return;}if(op==="space"){insert(" ");return;}if(op==="char"){const v=b.dataset.value;if(ctrl){shortcut(v.toLowerCase());return;}insert(shift?b.dataset.shift||v:v);}}
let repeatDelay=null,repeatInterval=null,pending=null;
function stopRepeat(){clearTimeout(repeatDelay);clearInterval(repeatInterval);repeatDelay=repeatInterval=null;}
const keyboard=document.getElementById("keyboard");
keyboard.addEventListener("pointerdown",function(e){
  const b=e.target.closest("button.key");if(!b)return;
  e.preventDefault();stopRepeat();
  if(e.pointerType==="touch"){
    pending={button:b,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,repeated:false};
    if(b.dataset.op==="arrow"||b.dataset.op==="backspace")repeatDelay=setTimeout(function(){
      if(!pending||pending.id!==e.pointerId||pending.moved)return;
      pending.repeated=true;press(b);repeatInterval=setInterval(function(){press(b);},75);
    },450);
  }else{
    press(b);
    if(b.dataset.op==="arrow"||b.dataset.op==="backspace")repeatDelay=setTimeout(function(){repeatInterval=setInterval(function(){press(b);},75);},450);
  }
});
keyboard.addEventListener("pointermove",function(e){
  if(pending&&pending.id===e.pointerId&&(Math.abs(e.clientX-pending.x)>9||Math.abs(e.clientY-pending.y)>9)){
    pending.moved=true;stopRepeat();
  }
});
keyboard.addEventListener("pointerup",function(e){
  if(pending&&pending.id===e.pointerId){if(!pending.moved&&!pending.repeated)press(pending.button);pending=null;}
  stopRepeat();
});
["pointercancel","pointerleave"].forEach(function(n){keyboard.addEventListener(n,function(){pending=null;stopRepeat();});});
keyboard.addEventListener("click",function(e){if(e.detail!==0)return;const b=e.target.closest("button.key");if(b)press(b);});
const kbViewport=document.getElementById("keyboard-viewport"),app=document.getElementById("app"),fitButton=document.getElementById("fit-keys");
function panKeyboard(dir){
  if(app.classList.contains("fit-keys"))return;
  const amount=Math.max(140,kbViewport.clientWidth*0.7)*dir;
  if(typeof kbViewport.scrollBy==="function")kbViewport.scrollBy({left:amount,behavior:"smooth"});
  else kbViewport.scrollLeft+=amount;
}
document.getElementById("pan-left").addEventListener("click",function(){panKeyboard(-1);});
document.getElementById("pan-right").addEventListener("click",function(){panKeyboard(1);});
fitButton.addEventListener("click",function(){
  const fit=app.classList.toggle("fit-keys");fitButton.setAttribute("aria-pressed",String(fit));
  fitButton.textContent=fit?"拡大表示":"全体表示";
  if(fit)kbViewport.scrollLeft=0;
});
document.getElementById("copy").addEventListener("click",function(){copy(code);});
document.getElementById("paste").addEventListener("click",paste);
document.getElementById("undo").addEventListener("click",function(){history(false);});
document.getElementById("redo").addEventListener("click",function(){history(true);});
document.getElementById("new").addEventListener("click",function(){if(code!==TEMPLATE&&!confirm("編集中のコードを初期テンプレートで置き換えますか？"))return;record();code=TEMPLATE;anchor=head=TEMPLATE.indexOf("\n    \n")+5;shift=0;ctrl=false;render();notice("テンプレートに戻しました");});
editor.addEventListener("keydown",function(e){if(e.key==="Escape"){editor.blur();return;}if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();if(["a","c","x","v","z","y"].includes(k)){e.preventDefault();readSelection();shortcut(k);}}});
try{const theme=localStorage.getItem("cpp-reference-theme");if(theme==="light")document.documentElement.dataset.theme="light";}catch(_){}
render();
})();
</script></body></html>
