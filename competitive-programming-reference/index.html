, 1, 4, 1, 5};\n    int N = A.size();\n    int i = 2, x = 9, l = 1, r = 4;\n    A.at(i) = x;\n    return 0;\n}\n","input":"","expected":null},{"id":"vector-5","desc":"先頭の要素を読む","code":"int x = A.front();","cost":"O(1)","note":"空でないこと","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3,1,4};\n    int i = 1;\n    int x = A.front();\n    return 0;\n}\n","input":"","expected":null},{"id":"vector-6","desc":"末尾の要素を読む","code":"int x = A.back();","cost":"O(1)","note":"空でないこと","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3,1,4};\n    int i = 1;\n    int x = A.back();\n    return 0;\n}\n","input":"","expected":null},{"id":"vector-7","desc":"要素数を求める","code":"int N = A.size();","cost":"O(1)","note":"size()自体は符号なし整数を返す","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3,1,4};\n    int N = A.size();\n    return 0;\n}\n","input":"","expected":null},{"id":"vector-8","desc":"空か判定する","code":"bool empty = A.empty();","cost":"O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3, 1, 4, 1, 5};\n    int N = A.size();\n    int i = 2, x = 9, l = 1, r = 4;\n    bool empty = A.empty();\n    return 0;\n}\n","input":"","expected":null},{"id":"vector-9","desc":"末尾にxを追加する","code":"A.push_back(x);","cost":"ならし O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector id":"string-5","desc":"空か判定する","code":"bool empty = S.empty();","cost":"O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    bool empty = S.empty();\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-6","desc":"末尾に1文字追加する","code":"S.push_back(c);","cost":"ならし O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    S.push_back(c);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-7","desc":"末尾に文字列Tを連結する","code":"S += T;","cost":"ならし O(Tの長さ)","note":"再確保時は元の文字列のコピーも発生","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    S += T;\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-8","desc":"末尾の文字を読む","code":"char last = S.back();","cost":"O(1)","note":"空でないこと","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    char last = S.back();\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-9","desc":"末尾の1文字を削除する","code":"S.pop_back();","cost":"O(1)","note":"空でないこと","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/c -programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    size_t p = S.find(T, pos);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-14","desc":"文字列Tが最後に現れる位置を探す","code":"size_t p = S.rfind(T);","cost":"最悪 O(N × Tの長さ)","note":"なければstring::npos","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    size_t p = S.rfind(T);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-15","desc":"検索結果が見つかったか判定する","code":"bool found = p != string::npos;","cost":"O(1)","note":"見つからない位置をatで読まない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    size_t p = S.find(T);\n    bool found = p != string::npos;\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-16","desc":"添字posの直前にTを挿入する","code":"S.insert(pos, T);","cost":"O(N + Tの長さ)","note":"0 ≤ pos ≤ N","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    S.insert(pos, T);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-17","desc":"添字posからk文字を削除する","code":"S.erase(pos, k);","cost":"O(N)","note":"第2引数は文字数","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    S.erase(pos, k);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-18","desc":"添字posからk文字をTに置き換える","code":"S.replace(pos, k, T);","cost":"O(N + Tの長さ)","note":"第2引数は文字数","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    S.replace(pos, k, T);\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-19","desc":"文字列の大小を辞書順で比較する","code":"bool smaller = S < T;","cost":"O(比較する文字数)","note":"大文字・小文字などは文字コード順","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    string S = \"abcabc\";\n    int i = 1, pos = 1, k = 3;\n    char c = 'x';\n    string T = \"bc\";\n    bool smaller = S < T;\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-20","desc":"文字の数字を整数にする","code":"int x = c - '0';","cost":"O(1)","note":"cが'0'〜'9'であること","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    char c = '7';\n    int x = c - '0';\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string-21","desc":"英小文字を0〜25の番号にする","code":"int x = c - 'a';","cost":"O(1)","note":"英小文字を前提とする","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    char c = 'c';\n    int x = c - 'a';\n    return 0;\n}\n","input":"1\nhello world\n","expected":null},{"id":"string- urn 0;\n}\n","input":"","expected":null},{"id":"dsu-3","desc":"頂点aとbが同じグループか判定する","code":"bool same = D.same(a, b);","cost":"ならし O(α(N))","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/dsu>\nusing namespace std;\n\nint main(){\n    atcoder::dsu D(5); int a = 0, b = 1; D.merge(0, 1);\n    bool same = D.same(a, b);\n    return 0;\n}\n","input":"","expected":null},{"id":"dsu-4","desc":"頂点aのグループの頂点数を求める","code":"int size = D.size(a);","cost":"ならし O(α(N))","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/dsu>\nusing namespace std;\n\nint main(){\n    atcoder::dsu D(5); int a = 0, b = 1; D.merge(0, 1);\n    int size = D.size(a);\n    return 0;\n}\n","input":"","expected":null},{"id":"dsu-5","desc":"頂点aのグループの代表頂点を求める","code":"int root = D.leader(a);","cost":"ならし O(α(N))","note":"代表は最小頂点とは限らず、結合で変わる","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/dsu>\nusing namespace std;\n\nint main(){\n    atcoder::dsu D(5); int a = 0, b = 1; D.merge(0, 1);\n    int root = D.leader(a);\n    return 0;\n}\n","input":"","expected":null},{"id":"dsu-6","desc":"全グループの頂点一覧を得る","code":"vector<vector<int>> groups = D.groups();","cost":"O(N)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/dsu>\nusing namespace std;\n\nint main(){\n    atcoder::dsu D(5); int a = 0, b = 1; D.merge(0, 1);\n    vector<vector<int>> groups = D.groups();\n    return 0;\n}\n","input":"","expected":null}]},{"page":"acl","key":"fenwick","title":"fenwick_tree：1点加算・区間和","note":"BITとも呼ぶ。0始まり、区間の右端は含まない。初期値はすべて0。sumはlong long内に収まるようにする。","items":[{"id":"fenwick-1","desc":"長さNの ree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/string>\nusing namespace std;\n\nint main(){\n    string S = \"ababa\";\n    vector<int> Z = atcoder::z_algorithm(S);\n    return 0;\n}\n","input":"","expected":null}]},{"page":"algo","key":"imos","title":"いもす法","reading":"いもすほう","note":"","items":[{"id":"prefix-3","desc":"区間への加算をすべて行った後、各要素の値を求める","code":"D.at(l) += x; D.at(r) -= x;","cost":"時間 O(N+Q) / メモリ O(N)","note":"すべての加算が終わってから、各要素の値を求める。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, Q;\n    cin >> N >> Q;\n    vector<long long> D(N+1, 0);\n    for(int i = 0;i < Q;i++){\n        int l, r;\n        long long x;\n        cin >> l >> r >> x; // 添字l以上r未満\n        D.at(l) += x;\n        D.at(r) -= x;\n    }\n    for(int i = 0;i < N;i++){\n        if(i > 0){\n            D.at(i) += D.at(i-1);\n        }\n        cout << D.at(i) << endl;\n    }\n    return 0;\n}\n","input":"5 1\n1 4 3\n","expected":"0\n3\n3\n3\n0\n","time":"O(N+Q)","memory":"O(N)"}]},{"page":"algo","key":"sieve","title":"エラトステネスの篩","reading":"えらとすてねすのふるい","note":"","items":[{"id":"number-3","desc":"N以下の整数が素数かをまとめて求める","code":"エラトステネスの篩","cost":"時間 O(N log log N) / メモリ O(N)","note":"Nは0以上。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<char> prime(N+1, true);\n    prime.at(0) = false;\n    if(N >= 1){\n        prime.at(1) = false;\n    }\n    for(long long x = 2;x*x <= N;x++){\n        if(!prime.at(x)){\n            continue;\n        }\n        for(long long y = x*x;y <= N;y += x){\n            prime.at(y) = false;\n        }\n    }\n    for(int x = 2;x <= N;x++){\n        if(prime.at(x)){\n            cout << x << endl;\n        }\n    }\n    return 0;\n}\n","input":"10\n","expected":"2\n3\n5\n7\n","time":"O(N log log N)","memory":"O(N)"}]},{"page":"algo","key":"stair-dp","title":"階段DP","reading":"かいだんでぃーぴー","note":"","items":[{"id":"dp-1","desc":"1段・2段ずつN段上る方法の数を余りで求める","code":"dp.at(i) = dp.at(i+1)+dp.at(i+2);","cost":"時間 O(N) / メモリ O(N)","note":"答えを998244353で割った余りを求める。AtCoder Libraryが必要。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\nusing mint = atcoder::modint998244353;\n\n// 入力: N (0 <= N <= 10^6 を想定)\n// 出力: 1段/2段ずつN段上る方法の数を998244353で割った余り\nint main(){\n    int N;\n    cin >> N;\n    vector<mint> dp(N+2, 0);\n    dp.at(N) = 1;\n    for(int i = N-1;i >= 0;i--){\n        dp.at(i) = dp.at(i+1) + dp.at(i+2);\n    }\n    cout << dp.at(0).val() << endl;\n}\n","input":"5\n","expected":"8\n","time":"O(N)","memory":"O(N)"}]},{"page":"algo","key":"grid-bfs","title":"グリッドBFS","reading":"ぐりっどびーえふえす","note":"","items":[{"id":"graph-3","desc":"壁のある盤面で、上下左右移動の最短距離を求める","code":"queue<pair<int,int>> Q;","cost":"時間 O(HW) / メモリ O(HW)","note":"上下左右に1マスずつ移動する。#は通れないマス。入力はH W、開始位置h w、目標位置h w、盤面の順。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int H, W, sh, sw, gh, gw;\n    cin >> H >> W >> sh >> sw >> gh >> gw;\n    vector<string> S(H);\n    for(int h = 0;h < H;h++){\n        cin >> S.at(h);\n    }\n    vector<vector<int>> dist(H, vector<int>(W, -1));\n    queue<pair<int,int>> Q;\n    if(S.at(sh).at(sw) != '#'){\n        dist.at(sh).at(sw) = 0;\n        Q.push({sh, sw});\n    }\n    vector<int> dh = {1,0,-1,0}, dw = {0,1,0,-1};\n    while(!Q.empty()){\n        int h = Q.front().first, w = Q.front().second;\n        Q.pop();\n        for(int k = 0;k < 4;k++){\n            int nh = h+dh.at(k), nw = w+dw.at(k);\n            if(nh < 0 || nh >= H || nw < 0 || nw >= W){\n                continue;\n            }\n            if(S.at(nh).at(nw) == '#' || dist.at(nh).at(nw) != -1){\n                continue;\n            }\n            dist.at(nh).at(nw) = dist.at(h).at(w)+1;\n            Q.push({nh,nw});\n        }\n    }\n    cout << dist.at(gh).at(gw) << endl;\n    return 0;\n}\n","input":"2 3 0 0 1 2\n.#.\n...\n","expected":"3\n","time":"O(HW)","memory":"O(HW)"}]},{"page":"algo","key":"answer-binary-search","title":"答えに対する二分探索","reading":"こたえにたいするにぶんたんさく","note":"","items":[{"id":"answer-search-1","desc":"x² ≥ Kとなる最小整数xを二分探索で求める","code":"while(ok-ng > 1)","cost":"時間 O(log K) / メモリ O(1)","note":"Kは1以上10¹⁸以下。別の問題に使うときは、判定式と最初のok・ngを書き換える。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: K (1 <= K <= 10^18)\n// 出力: x*x >= K となる最小の非負整数x\nint main(){\n    long long K;\n    cin >> K;\n    long long ng = 0;\n    long long ok = K;\n    while(ok-ng > 1){\n        long long mid = ng + (ok-ng)/2;\n        long long required = K/mid + (K % mid != 0);\n        if(mid >= required){\n            ok = mid;\n        }\n        else{\n            ng = mid;\n        }\n    }\n    cout << ok << endl;\n}\n","input":"20\n","expected":"5\n","time":"O(log K)","memory":"O(1)"}]},{"page":"algo","key":"lis-quadratic","title":"最長増加部分列（二重ループ）","reading":"さいちょうぞうかぶぶんれつにじゅうるーぷ","note":"","items":[{"id":"dp-2","desc":"狭義単調増加部分列の最大長を求める（二重ループ版）","code":"LIS","cost":"時間 O(N²) / メモリ O(N)","note":"元の順番のまま選び、次に選ぶ値は前の値より大きくする。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n\n    vector<int> dp(N, 1);\n    int ans = 0;\n    for(int i = 0;i < N;i++){\n        for(int j = 0;j < i;j++){\n            if(A.at(j) < A.at(i)){\n                dp.at(i) = max(dp.at(i), dp.at(j)+1);\n            }\n        }\n        ans = max(ans, dp.at(i));\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"4\n3 1 2 5\n","expected":"3\n","time":"O(N²)","memory":"O(N)"}]},{"page":"algo","key":"lis-binary-search","title":"最長増加部分列（二分探索）","reading":"さいちょうぞうかぶぶんれつにぶんたんさく","note":"","items":[{"id":"dp-3","desc":"狭義単調増加部分列の最大長を求める（高速版）","code":"LIS","cost":"時間 O(N log N) / メモリ O(N)","note":"元の順番のまま選び、次に選ぶ値は前の値より大きくする。tailには、実際に選んだ並びが入るとは限らない。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n\n    vector<int> tail;\n    for(int i = 0;i < N;i++){\n        auto it = lower_bound(tail.begin(), tail.end(), A.at(i));\n        if(it == tail.end()){\n            tail.push_back(A.at(i));\n        }\n        else{\n            *it = A.at(i);\n        }\n    }\n    cout << tail.size() << endl;\n    return 0;\n}\n","input":"4\n3 1 2 5\n","expected":"3\n","time":"O(N log N)","memory":"O(N)"}]},{"page":"algo","key":"coordinate-compression","title":"座標圧縮","reading":"ざひょうあっしゅく","note":"","items":[{"id":"enumeration-3","desc":"値の大小関係を保ったまま、0始まりの順位へ置き換える","code":"lower_bound(B.begin(), B.end(), A.at(i)) - B.begin()","cost":"時間 O(N log N) / メモリ O(N)","note":"値の大小と一致は保つが、値同士の差は保たない。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    vector<long long> B = A;\n    sort(B.begin(), B.end());\n    B.erase(unique(B.begin(), B.end()), B.end());\n    for(int i = 0;i < N;i++){\n        int p = lower_bound(B.begin(), B.end(), A.at(i)) - B.begin();\n        cout << p << endl;\n    }\n    return 0;\n}\n","input":"4\n100 5 100 20\n","expected":"2\n0\n2\n1\n","time":"O(N log N)","memory":"O(N)"}]},{"page":"algo","key":"two-pointers","title":"しゃくとり法","reading":"しゃくとりほう","note":"","items":[{"id":"answer-search-2","desc":"区間の合計がK以下になる、空でない連続部分の個数を数える","code":"ans += r-l;","cost":"時間 O(N) / メモリ O(N)","note":"配列の値がすべて0以上。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    long long K;\n    cin >> N >> K;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    int r = 0;\n    long long sum = 0, ans = 0;\n    for(int l = 0;l < N;l++){\n        while(r < N && sum + A.at(r) <= K){\n            sum += A.at(r);\n            r++;\n        }\n        ans += r-l;\n        if(r == l){\n            r++;\n        }\n        else{\n            sum -= A.at(l);\n        }\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"3 3\n2 1 3\n","expected":"4\n","time":"O(N)","memory":"O(N)"}]},{"page":"algo","key":"permutation-enumeration","title":"順列全探索","reading":"じゅんれつぜんたんさく","note":"","items":[{"id":"enumeration-2","desc":"配列の値の全順列を列挙する","code":"do{ ... }while(next_permutation(A.begin(), A.end()));","cost":"時間 O(N × N!) / メモリ O(N)","note":"同じ値があっても、同じ並びは1回だけ出力する。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    sort(A.begin(), A.end());\n    do{\n        for(int i = 0;i < N;i++){\n            if(i > 0){\n                cout << \" \";\n            }\n            cout << A.at(i);\n        }\n        cout << endl;\n    }while(next_permutation(A.begin(), A.end()));\n    return 0;\n}\n","input":"2\n2 1\n","expected":"1 2\n2 1\n","time":"O(N × N!)","memory":"O(N)"}]},{"page":"algo","key":"prime-factorization","title":"素因数分解","reading":"そいんすうぶんかい","note":"","items":[{"id":"number-4","desc":"正整数Nを素因数と指数に分解する","code":"while(N % x == 0)","cost":"時間 O(√N) / メモリ O(log N)","note":"Nは1以上。処理中にNの値を書き換える。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    long long N;\n    cin >> N;\n    vector<pair<long long,int>> factors;\n    for(long long x = 2;x <= N/x;x++){\n        int cnt = 0;\n        while(N % x == 0){\n            N /= x;\n            cnt++;\n        }\n        if(cnt > 0){\n            factors.push_back({x,cnt});\n        }\n    }\n    if(N > 1){\n        factors.push_back({N,1});\n    }\n    for(int i = 0;i < (int)factors.size();i++){\n        cout << factors.at(i).first << \" \" << factors.at(i).second << endl;\n    }\n    return 0;\n}\n","input":"360\n","expected":"2 3\n3 2\n5 1\n","time":"O(√N)","memory":"O(log N)"}]},{"page":"algo","key":"primality-trial","title":"素数判定（試し割り）","reading":"そすうはんていためしわり","note":"","items":[{"id":"number-2","desc":"整数Nが素数か判定する","code":"is_prime(N)","cost":"時間 O(√N) / メモリ O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nbool is_prime(long long N){\n    if(N < 2){\n        return false;\n    }\n    for(long long x = 2;x <= N/x;x++){\n        if(N % x == 0){\n            return false;\n        }\n    }\n    return true;\n}\n\nint main(){\n    long long N;\n    cin >> N;\n    cout << (is_prime(N) ? \"Yes\" : \"No\") << endl;\n    return 0;\n}\n","input":"97\n","expected":"Yes\n","time":"O(√N)","memory":"O(1)"}]},{"page":"algo","key":"dijkstra","title":"ダイクストラ法（Dijkstra）","reading":"だいくすとらほう","note":"","items":[{"id":"graph-2","desc":"一方通行のルートで、頂点1から各頂点までの最小の移動コストを求める","code":"dijkstra","cost":"時間 O((N+M) log(N+M)) / メモリ O(N+M)","note":"各ルートを通るコストは0以上。一方通行のルートを扱う。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: N M、続いてM本の有向辺 a b cost (頂点は1始まり)\n// N >= 1、cost >= 0、有限の最短距離はINF未満、距離+costはlong long内\n// 出力: 頂点1から各頂点への最短距離。到達不可は-1\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<pair<int, long long>>> G(N);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        long long cost;\n        cin >> a >> b >> cost;\n        a--; b--;\n        G.at(a).push_back({b, cost});\n        // 無向グラフなら次の行も有効にする\n        // G.at(b).push_back({a, cost});\n    }\n    const long long INF = (1LL << 60);\n    vector<long long> dist(N, INF);\n    priority_queue<pair<long long, int>, vector<pair<long long, int>>,\n                   greater<pair<long long, int>>> Q;\n    dist.at(0) = 0;\n    Q.push({0, 0});\n    while(!Q.empty()){\n        long long d = Q.top().first;\n        int v = Q.top().second;\n        Q.pop();\n        if(d != dist.at(v)){\n            continue;\n        }\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i).first;\n            long long cost = G.at(v).at(i).second;\n            if(dist.at(to) > d+cost){\n                dist.at(to) = d+cost;\n                Q.push({dist.at(to), to});\n            }\n        }\n    }\n    for(int i = 0;i < N;i++){\n        if(dist.at(i) == INF){\n            cout << -1 << endl;\n        }\n        else{\n            cout << dist.at(i) << endl;\n        }\n    }\n}\n","input":"4 3\n1 2 8\n1 3 2\n3 2 1\n","expected":"0\n3\n2\n-1\n","time":"O((N+M) log(N+M))","memory":"O(N+M)"}]},{"page":"algo","key":"topological-sort","title":"トポロジカルソート","reading":"とぽろじかるそーと","note":"","items":[{"id":"graph-4","desc":"有向辺の前後関係を守る順番を求める","code":"入次数0の頂点からqueueで取り出す","cost":"時間 O(N+M) / メモリ O(N+M)","note":"入力のa→bは、aをbより先に処理する指定。順番を決められない場合は−1を出力する。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<int>> G(N);\n    vector<int> indeg(N, 0);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        cin >> a >> b;\n        a--; b--;\n        G.at(a).push_back(b);\n        indeg.at(b)++;\n    }\n    queue<int> Q;\n    for(int v = 0;v < N;v++){\n        if(indeg.at(v) == 0){\n            Q.push(v);\n        }\n    }\n    vector<int> order;\n    while(!Q.empty()){\n        int v = Q.front();\n        Q.pop();\n        order.push_back(v);\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i);\n            indeg.at(to)--;\n            if(indeg.at(to) == 0){\n                Q.push(to);\n            }\n        }\n    }\n    if((int)order.size() != N){\n        cout << -1 << endl;\n    }\n    else{\n        for(int i = 0;i < N;i++){\n            cout << order.at(i)+1 << endl;\n        }\n    }\n    return 0;\n}\n","input":"3 2\n1 2\n2 3\n","expected":"1\n2\n3\n","time":"O(N+M)","memory":"O(N+M)"}]},{"page":"algo","key":"knapsack","title":"ナップサックDP（0/1）","reading":"なっぷさっくでぃーぴー","note":"","items":[{"id":"dp-4","desc":"各品物を1個まで選び、重さW以下で価値の和を最大化する","code":"dp.at(w) = max(dp.at(w), dp.at(w-weight)+value);","cost":"時間 O(NW) / メモリ O(W)","note":"品物の重さは1以上の整数。同じ品物は2回選ばない。入力はN W、各品物の重さと価値の順。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, W;\n    cin >> N >> W;\n    vector<long long> dp(W+1, 0);\n    for(int i = 0;i < N;i++){\n        int weight;\n        long long value;\n        cin >> weight >> value;\n        for(int w = W;w >= weight;w--){\n            dp.at(w) = max(dp.at(w), dp.at(w-weight)+value);\n        }\n    }\n    cout << dp.at(W) << endl;\n    return 0;\n}\n","input":"3 5\n2 3\n3 4\n4 5\n","expected":"7\n","time":"O(NW)","memory":"O(W)"}]},{"page":"algo","key":"prefix-sum-2d","title":"二次元累積和","reading":"にじげんるいせきわ","note":"","items":[{"id":"prefix-2","desc":"二次元配列の長方形内の和を求める","code":"S.at(h2).at(w2)-S.at(h1).at(w2)-S.at(h2).at(w1)+S.at(h1).at(w1)","cost":"時間 O(HW+Q) / メモリ O(HW)","note":"盤面の値を途中で書き換えない場合に使う。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int H, W, Q;\n    cin >> H >> W >> Q;\n    vector<vector<long long>> S(H+1, vector<long long>(W+1, 0));\n    for(int h = 0;h < H;h++){\n        for(int w = 0;w < W;w++){\n            long long x;\n            cin >> x;\n            S.at(h+1).at(w+1) = x + S.at(h).at(w+1) + S.at(h+1).at(w) - S.at(h).at(w);\n        }\n    }\n    for(int i = 0;i < Q;i++){\n        int h1, w1, h2, w2;\n        cin >> h1 >> w1 >> h2 >> w2; // 行[h1,h2)、列[w1,w2)\n        long long ans = S.at(h2).at(w2)-S.at(h1).at(w2)-S.at(h2).at(w1)+S.at(h1).at(w1);\n        cout << ans << endl;\n    }\n    return 0;\n}\n","input":"2 2 1\n1 2\n3 4\n0 1 2 2\n","expected":"6\n","time":"O(HW+Q)","memory":"O(HW)"}]},{"page":"algo","key":"bfs","title":"幅優先探索（BFS）","reading":"はばゆうせんたんさく","note":"","items":[{"id":"graph-1","desc":"無向・重みなしグラフで頂点1からの最短距離を求める","code":"bfs","cost":"時間 O(N+M) / メモリ O(N+M)","note":"どのルートも1回の移動として数える。行き来できるルートを扱い、到達できない地点は−1を出力する。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: N M、続いてM本の無向辺 a b (頂点は1始まり)。N >= 1\n// 出力: 頂点1から各頂点への最短距離。到達不可は-1\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<int>> G(N);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        cin >> a >> b;\n        a--; b--;\n        G.at(a).push_back(b);\n        G.at(b).push_back(a);\n    }\n    vector<int> dist(N, -1);\n    queue<int> Q;\n    dist.at(0) = 0;\n    Q.push(0);\n    while(!Q.empty()){\n        int v = Q.front();\n        Q.pop();\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i);\n            if(dist.at(to) != -1){\n                continue;\n            }\n            dist.at(to) = dist.at(v)+1;\n            Q.push(to);\n        }\n    }\n    for(int i = 0;i < N;i++){\n        cout << dist.at(i) << endl;\n    }\n}\n","input":"4 2\n1 2\n2 3\n","expected":"0\n1\n2\n-1\n","time":"O(N+M)","memory":"O(N+M)"}]},{"page":"algo","key":"bit-enumeration","title":"ビット全探索","reading":"びっとぜんたんさく","note":"","items":[{"id":"enumeration-1","desc":"各要素を選ぶ・選ばない全組合せで、和がKになる数を数える","code":"if((bit >> i) & 1LL)","cost":"時間 O(N × 2ᴺ) / メモリ O(N)","note":"何も選ばない場合も含む。Nが20前後までの規模向け。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    long long K;\n    cin >> N >> K;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    long long ans = 0;\n    for(long long bit = 0;bit < (1LL << N);bit++){\n        long long sum = 0;\n        for(int i = 0;i < N;i++){\n            if((bit >> i) & 1LL){\n                sum += A.at(i);\n            }\n        }\n        if(sum == K){\n            ans++;\n        }\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"3 5\n2 3 5\n","expected":"2\n","time":"O(N × 2ᴺ)","memory":"O(N)"}]},{"page":"algo","key":"equal-pair-count","title":"ペア数の数え上げ（同じ値）","reading":"ぺあすうのかぞえあげおなじあたい","note":"","items":[{"id":"enumeration-4","desc":"同じ値を持つ添字のペア数を求める","code":"num * (num-1) / 2","cost":"時間 O(N log N) / メモリ O(値の種類数)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    map<long long, long long> cnt;\n    for(int i = 0;i < N;i++){\n        long long x;\n        cin >> x;\n        cnt[x]++;\n    }\n    long long ans = 0;\n    for(auto it = cnt.begin();it != cnt.end();it++){\n        long long num = it->second;\n        ans += num*(num-1)/2;\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"5\n2 2 2 3 3\n","expected":"4\n","time":"O(N log N)","memory":"O(値の種類数)"}]},{"page":"algo","key":"divisors","title":"約数列挙","reading":"やくすうれっきょ","note":"","items":[{"id":"number-1","desc":"正整数Nの約数を昇順に列挙する","code":"for(long long x = 1;x <= N/x;x++)","cost":"時間 O(√N + D log D) / メモリ O(D)","note":"Nは1以上。Dは約数の個数。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    long long N;\n    cin >> N;\n    vector<long long> D;\n    for(long long x = 1;x <= N/x;x++){\n        if(N % x == 0){\n            D.push_back(x);\n            if(x != N/x){\n                D.push_back(N/x);\n            }\n        }\n    }\n    sort(D.begin(), D.end());\n    for(int i = 0;i < (int)D.size();i++){\n        cout << D.at(i) << endl;\n    }\n    return 0;\n}\n","input":"12\n","expected":"1\n2\n3\n4\n6\n12\n","time":"O(√N + D log D)","memory":"O(D)"}]},{"page":"algo","key":"prefix-sum","title":"累積和","reading":"るいせきわ","note":"","items":[{"id":"prefix-1","desc":"更新なしの配列で、区間の和を繰り返し求める","code":"S.at(r) - S.at(l)","cost":"時間 O(N+Q) / メモリ O(N)","note":"配列の値を途中で書き換えない場合に使う。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, Q;\n    cin >> N >> Q;\n    vector<long long> A(N), S(N+1, 0);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n        S.at(i+1) = S.at(i) + A.at(i);\n    }\n    for(int i = 0;i < Q;i++){\n        int l, r;\n        cin >> l >> r; // 添字l以上r未満\n        cout << S.at(r)-S.at(l) << endl;\n    }\n    return 0;\n}\n","input":"4 3\n3 1 4 2\n1 3\n0 4\n2 2\n","expected":"5\n10\n0\n","time":"O(N+Q)","memory":"O(N)"}]}],"limits":[{"key":"time-guide","title":"計算量：制約から見る候補","content":"<div class=\"table-wrap\"><table><thead><tr><th>入力規模<\/th><th>候補になる計算量<\/th><\/tr><\/thead><tbody><tr><td>N ≲ 10<\/td><td>O(N × N!)<\/td><\/tr><tr><td>N ≲ 20<\/td><td>O(N × 2ᴺ)<\/td><\/tr><tr><td>N ≲ 3×10³<\/td><td>O(N²)<\/td><\/tr><tr><td>N ≲ 2×10⁵<\/td><td>O(N log N)、O(N)<\/td><\/tr><tr><td>値の範囲が10⁹〜10¹⁸<\/td><td>二分探索・数式など。値を1ずつ列挙しない<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">制限時間・処理内容・定数倍で変わる目安。秒数の保証ではない。<\/p>"},{"key":"time-count","title":"計算量：式にNを入れた規模","content":"<div class=\"table-wrap\"><table><thead><tr><th>N / O(N)<\/th><th>N log₂N<\/th><th>N²<\/th><th>N³<\/th><\/tr><\/thead><tbody><tr><td>10²<\/td><td>6.6×10²<\/td><td>10⁴<\/td><td>10⁶<\/td><\/tr><tr><td>10³<\/td><td>10×10³<\/td><td>10⁶<\/td><td>10⁹<\/td><\/tr><tr><td>3×10³<\/td><td>3.5×10⁴<\/td><td>9×10⁶<\/td><td>2.7×10¹⁰<\/td><\/tr><tr><td>10⁴<\/td><td>1.3×10⁵<\/td><td>10⁸<\/td><td>10¹²<\/td><\/tr><tr><td>2×10⁵<\/td><td>3.5×10⁶<\/td><td>4×10¹⁰<\/td><td>8×10¹⁵<\/td><\/tr><tr><td>10⁶<\/td><td>2×10⁷<\/td><td>10¹²<\/td><td>10¹⁸<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th>N<\/th><th>2ᴺ<\/th><th>N × 2ᴺ<\/th><th>N!<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>1×10³<\/td><td>1×10⁴<\/td><td>3.6×10⁶<\/td><\/tr><tr><td>15<\/td><td>3.3×10⁴<\/td><td>4.9×10⁵<\/td><td>1.3×10¹²<\/td><\/tr><tr><td>20<\/td><td>1×10⁶<\/td><td>2.1×10⁷<\/td><td>2.4×10¹⁸<\/td><\/tr><tr><td>25<\/td><td>3.4×10⁷<\/td><td>8.4×10⁸<\/td><td>1.6×10²⁵<\/td><\/tr><tr><td>30<\/td><td>1.1×10⁹<\/td><td>3.2×10¹⁰<\/td><td>2.7×10³²<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">実際のCPU命令数ではなく、計算量の式の値。文字列コピーやmap操作などは単純な加算より重い。<\/p>"},{"key":"type-memory","title":"型と配列のメモリ","content":"<div class=\"table-wrap\"><table><thead><tr><th>型<\/th><th>1要素の目安<\/th><th>10⁵要素<\/th><th>10⁶要素<\/th><th>10⁷要素<\/th><\/tr><\/thead><tbody><tr><td>char<\/td><td>1 B<\/td><td>100 KB<\/td><td>1 MB<\/td><td>10 MB<\/td><\/tr><tr><td>int<\/td><td>4 B<\/td><td>400 KB<\/td><td>4 MB<\/td><td>40 MB<\/td><\/tr><tr><td>long long / double<\/td><td>8 B<\/td><td>800 KB<\/td><td>8 MB<\/td><td>80 MB<\/td><\/tr><tr><td>pair&lt;int,int&gt;<\/td><td>通常8 B<\/td><td>約800 KB<\/td><td>約8 MB<\/td><td>約80 MB<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">この表はint=4 B、long long=8 B、double=8 Bの一般的なGCC環境を想定。実際はsizeofで確認。1 KB=10³ B、1 MB=10⁶ B。1 KiB=2¹⁰ B、1 MiB=2²⁰ B。<\/p>"},{"key":"matrix-memory","title":"二次元配列のメモリ","content":"<div class=\"table-wrap\"><table><thead><tr><th>H × W<\/th><th>要素数<\/th><th>int<\/th><th>long long / double<\/th><\/tr><\/thead><tbody><tr><td>10² × 10²<\/td><td>10⁴<\/td><td>40 KB<\/td><td>80 KB<\/td><\/tr><tr><td>10³ × 10³<\/td><td>10⁶<\/td><td>4 MB<\/td><td>8 MB<\/td><\/tr><tr><td>2×10³ × 2×10³<\/td><td>4×10⁶<\/td><td>16 MB<\/td><td>32 MB<\/td><\/tr><tr><td>3×10³ × 3×10³<\/td><td>9×10⁶<\/td><td>36 MB<\/td><td>72 MB<\/td><\/tr><tr><td>5×10³ × 5×10³<\/td><td>2.5×10⁷<\/td><td>100 MB<\/td><td>200 MB<\/td><\/tr><tr><td>10⁴ × 10⁴<\/td><td>10⁸<\/td><td>400 MB<\/td><td>800 MB<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">要素本体の容量。vector&lt;vector&lt;T&gt;&gt;には行ごとのvector管理領域・確保処理も加わる。大きなローカル固定長配列はスタック上限にも注意し、vectorを使う。<\/p>"},{"key":"memory-limit","title":"メモリ上限との比較","content":"<div class=\"table-wrap\"><table><thead><tr><th>上限<\/th><th>intだけで使い切る理論要素数<\/th><th>正方形int配列の理論最大辺長<\/th><\/tr><\/thead><tbody><tr><td>256 MiB<\/td><td>約6.7×10⁷<\/td><td>8192<\/td><\/tr><tr><td>512 MiB<\/td><td>約1.3×10⁸<\/td><td>11585<\/td><\/tr><tr><td>1024 MiB<\/td><td>約2.7×10⁸<\/td><td>16384<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">上限の単位がMiBの場合の理論値であり、安全な確保量ではない。実行環境・他の変数・コピー・管理領域の分を差し引く。MB表記なら10⁶ Bで計算する。<\/p><p>合計容量 ≈ 配列ごとの「要素数 × sizeof(型)」の合計 + 管理領域。intのN×N配列をコピーすれば本体だけで8N² B。long longのN×N累積和なら約8(N+1)² B。<\/p>"},{"key":"memory-extra","title":"容器・グラフ・コピーの注意","content":"<div class=\"table-wrap\"><table><thead><tr><th>対象<\/th><th>見積もり<\/th><\/tr><\/thead><tbody><tr><td>vector&lt;T&gt;<\/td><td>確保済みcapacity × sizeof(T) + 管理領域。sizeだけでは正確に見積もれない<\/td><\/tr><tr><td>vector&lt;vector&lt;T&gt;&gt;<\/td><td>各行のcapacity × sizeof(T) + H個のvector管理領域 + 各確保の管理領域<\/td><\/tr><tr><td>map / set / multiset<\/td><td>ノードごとのポインタ・色などで、値本体より大きくなる。要素数×sizeof(値)だけでは不足<\/td><\/tr><tr><td>unordered_map / unordered_set<\/td><td>要素ノードに加え、バケット配列も必要<\/td><\/tr><tr><td>無向グラフの隣接リスト<\/td><td>intの行き先を通常2M個持つ。本体約8M B + N個のvectorなど<\/td><\/tr><tr><td>vector&lt;bool&gt;<\/td><td>一般にbit圧縮。通常のbool配列とは扱いが異なる。分かりやすさ重視ならvector&lt;char&gt;<\/td><\/tr><tr><td>関数の引数<\/td><td>vector&lt;int&gt; Aはコピー。const vector&lt;int&gt;&amp; Aなら読むだけで参照<\/td><\/tr><tr><td>再帰DFS<\/td><td>呼び出しごとのスタックも消費。深いグラフではstackなどの反復実装を検討<\/td><\/tr><\/tbody><\/table><\/div>"},{"key":"sizeof","title":"sizeof：実際の型のサイズを確認","content":"<p>型のサイズをB単位で出力する。sizeof(vector&lt;int&gt;)は要素本体を含まない。<\/p><details class=\"code-only\"><summary>全体コードを開く<\/summary><pre><code>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main(){\n    cout &lt;&lt; sizeof(int) &lt;&lt; endl;\n    cout &lt;&lt; sizeof(long long) &lt;&lt; endl;\n    cout &lt;&lt; sizeof(double) &lt;&lt; endl;\n    cout &lt;&lt; sizeof(vector&lt;int&gt;) &lt;&lt; endl;\n    return 0;\n}\n<\/code><\/pre><\/details>"}],"source":"https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference"}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('reference-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emphasize = s => esc(s).replaceAll('添字','<strong class="index-word">添字</strong>');
const entries = new Map(DATA.groups.flatMap(g => g.items.map(i => [i.id,i])));
let page = 'std', timer, query = '';
let selectedTocHref = '';
function syncTocHighlight(){
    document.querySelectorAll('.side-link').forEach(link=>{
        const selected=link.getAttribute('href')===selectedTocHref;
        link.classList.toggle('current',selected);
        if(selected){link.setAttribute('aria-current','location');}
        else{link.removeAttribute('aria-current');}
    });
}
function clearTocHighlight(){
    selectedTocHref='';syncTocHighlight();
}
function notify(message){ $('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200); }
function sourceNote(){return '<footer><a href="'+DATA.source+'" target="_blank" rel="noopener">公開ソース・共通の前提</a> · <a href="https://info.atcoder.jp/entry/llm-rules-ja" target="_blank" rel="noopener">AtCoderの利用ルール</a></footer>';}
function fullCode(i){
    return '<div class="full-code"><div class="code-toolbar"><span>C++23 (GCC 15.2.0) · #include / main() を含む全体コード</span><div class="code-actions"><button type="button" class="copy" data-copy="'+i.id+'">コードをコピー</button><button type="button" class="download" data-download="'+i.id+'">C++ファイルを保存</button></div></div><pre><code>'+esc(i.full)+'</code></pre></div>';
}
function operation(i, algo, groupNote=''){
    if(algo){
        const notes=[groupNote,i.note].filter(Boolean).join(' ');
        return '<article class="algorithm-entry" id="'+i.id+'"><p class="algorithm-purpose"><strong>目的</strong>　'+emphasize(i.desc)+'</p><p class="algorithm-cost"><strong>全体の時間</strong> '+esc(i.time)+'　 /　 <strong>メモリ</strong> '+esc(i.memory)+'</p>'+(notes?'<p class="section-note">'+emphasize(notes)+'</p>':'')+fullCode(i)+'</article>';
    }
    return '<details class="op" id="'+i.id+'"><summary class="op-row"><span class="desc">'+emphasize(i.desc)+(i.note?'<span class="row-note">'+emphasize(i.note)+'</span>':'')+'</span><code class="short">'+esc(i.code)+'</code><span class="cost">'+esc(i.cost)+'</span><span class="expand">全体コード</span></summary>'+fullCode(i)+'</details>';
}
function section(g, items){
    const algo=g.page==='algo';
    return '<section class="section '+(algo?'algo':'')+'" id="'+g.key+'"><h2>'+esc(g.title)+'<a href="#'+g.page+'/'+g.key+'" aria-label="この項目のリンク">#</a></h2>'+(g.note&&!algo?'<p class="section-note">'+emphasize(g.note)+'</p>':'')+(algo?'':'<div class="operations"><div class="column-head"><span>機能</span><span>コード</span><span>計算量</span><span>展開</span></div>')+items.map(i=>operation(i,algo,g.note)).join('')+(algo?'':'</div>')+'</section>';
}
function termsMatch(text){const t=text.toLocaleLowerCase();return query.trim().toLocaleLowerCase().split(/\s+/).every(q=>t.includes(q));}
function render(){
    query=$('#search').value.trim(); const searching=!!query;
    document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});
    let sections=[],side=[],total=0;
    if(searching){
        for(const g of DATA.groups){const items=g.items.filter(i=>termsMatch(g.title+' '+g.note+' '+(g.keywords||'')+' '+i.desc+' '+i.code+' '+i.note));if(items.length){sections.push(section(g,items));side.push([g.key,g.title,g.page]);total+=items.length;}}
        for(const s of DATA.limits){if(termsMatch(s.title+' '+s.content.replace(/<[^>]*>/g,' '))){sections.push('<section class="section limits" id="'+s.key+'"><h2>'+s.title+'</h2>'+s.content+'</section>');side.push([s.key,s.title,'limits']);total++;}}
    }else if(page==='limits'){
        sections=DATA.limits.map(s=>'<section class="section limits" id="'+s.key+'"><h2>'+s.title+'</h2>'+s.content+'</section>');side=DATA.limits.map(s=>[s.key,s.title,'limits']);
    }else{
        for(const g of DATA.groups.filter(g=>g.page===page)){sections.push(section(g,g.items));side.push([g.key,g.title,g.page]);total+=g.items.length;}
    }
    // 目次には候補を残し、本文のDOMには選択した1項目だけを置く。
    let selectedIndex=side.findIndex(([key,title,p])=>'#'+p+'/'+key===selectedTocHref);
    if(selectedIndex<0&&side.length){selectedIndex=0;}
    selectedTocHref=selectedIndex<0?'':'#'+side[selectedIndex][2]+'/'+side[selectedIndex][0];
    const selectedContent=selectedIndex<0?'':sections[selectedIndex];
    const selectedKey=selectedIndex<0?'':side[selectedIndex][0];
    let sideHTML='';let label='';
    for(const [key,title,p] of side){let next=p==='std'?(DATA.groups.findIndex(g=>g.key===key)<7?'容器・データを持つもの':'操作関数'):DATA.pages[p].title;if(next!==label){sideHTML+='<div class="side-label">'+esc(next)+'</div>';label=next;}sideHTML+='<a class="side-link" href="#'+p+'/'+key+'">'+esc(title)+'</a>';}
    $('#sidebar').innerHTML=sideHTML;
    $('#main').innerHTML='<details class="mobile-index"><summary>このページの目次</summary><div>'+sideHTML+'</div></details>'+(selectedContent||'<div class="empty">該当する項目がありません。検索語を短くしてください。</div>')+sourceNote();
    syncTocHighlight();
}
function jumpFromHash(){
    const [p,key]=decodeURIComponent(location.hash.slice(1)).split('/');
    if(DATA.pages[p]){page=p;}
    selectedTocHref=key?'#'+page+'/'+key:'';
    render();
    window.scrollTo({top:0,left:0,behavior:'instant'});
}
document.addEventListener('click',e=>{
    const link=e.target.closest('.side-link');
    if(!link||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey){return;}
    e.preventDefault();
    selectedTocHref=link.getAttribute('href');
    if(location.hash!==selectedTocHref){history.pushState(null,'',selectedTocHref);}
    jumpFromHash();syncTocHighlight();
});
$('#search').addEventListener('input',()=>{clearTocHighlight();render();});
$('#clear').addEventListener('click',()=>{clearTocHighlight();$('#search').value='';query='';render();$('#search').focus();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{clearTocHighlight();page=b.dataset.page;$('#search').value='';query='';history.replaceState(null,'','#'+page);render();window.scrollTo(0,0);}));
document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render();$('#search').blur();}});
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){const code=entries.get(copy.dataset.copy).full;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code);}else{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();const success=document.execCommand('copy');ta.remove();if(!success)throw Error('copy');}notify('全体コードをコピーしました');}catch{notify('コピーできませんでした。.cppを保存するか、コードを選択してください');}}
const dl=e.target.closest('[data-download]');if(dl){const item=entries.get(dl.dataset.download);const url=URL.createObjectURL(new Blob([item.full],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=item.id+'.cpp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
$('#theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('cpp-reference-theme',theme);}catch{}});
try{document.documentElement.dataset.theme=localStorage.getItem('cpp-reference-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch{}
window.addEventListener('hashchange',jumpFromHash);render();jumpFromHash();
</script>
</body>
</html>
