, 4]","keywords":""},{"id":"vector-12","desc":"添字iの1要素を削除する","code":"A.erase(A.begin()+i);","cost":"O(N)","note":"⚠︎ 削除位置は0以上、要素数未満。削除位置より後ろの添字が前にずれる","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3, 1, 4, 1, 5};\n    int N = A.size();\n    int i = 2, x = 9, l = 1, r = 4;\n    A.erase(A.begin()+i);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数","example":"i = 1\n実行前：[3, 1, 4]\n実行後：[3, 4]","keywords":" 消す 削除 消去"},{"id":"vector-13","desc":"添字l以上r未満を削除する","code":"A.erase(A.begin()+l, A.begin()+r);","cost":"O(N)","note":"⚠︎ 0 ≤ l ≤ r ≤ 要素数。削除した区間より後ろの添字が前にずれる","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3, 1, 4, 1, 5};\n    int N = A.size();\n    int i = 2, x = 9, l = 1, r = 4;\n    A.erase(A.begin()+l, A.begin()+r);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数","example":"l = 1、r = 3\n実行前：[3, 1, 4, 2, 5]\n実行後：[3, 2, 5]","keywords":" 消す 削除 消去"},{"id":"vector-14","desc":"要素数をNにする","code":"A.resize(N, -1);","cost":"O(N + 変更前の要素数)","note":"⚠︎ 増えた要素だけ−1。減らした部分は失われる","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    vector<int> A = {3, 1, 4, 1, 5};\n    int N = A.size();\n    int i = 2, x = 9, l = 1, r = 4;\n    A.resize(N, -1);\n    return 0;\n}\n","input":"","expected":null,"memory":"再確保時 O(N)","definitions":"N：指定した要素数（変更前の要素数は別）","example":"","keywords":""},{"id":"vector-15","desc":"N要素ぶんの容量を予約する","code":"A.reserve(N);","cost":"再確保時 O(現在の要素数)","note":"⚠︎ 要素数は増えない。atで新しい位置を読めるようにはならない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competi ference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    multiset<int> S = {2,5,5};\n    int N = S.size();\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"set-6","desc":"xの個数を求める","code":"int cnt = S.count(x);","cost":"set: O(log N) / multiset: O(log N + K)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    multiset<int> S = {2,5,5}; int x = 5;\n    int cnt = S.count(x);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数 / K：同じ値の個数","example":"","keywords":" 個数 数える カウント"},{"id":"set-7","desc":"xをすべて削除する","code":"S.erase(x);","cost":"O(log N + 削除数)","note":"⚠︎ multisetでは同じ値が全部消える","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    multiset<int> S = {2,5,5}; int x = 5;\n    S.erase(x);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数","example":"","keywords":" 消す 削除 消去"},{"id":"set-8","desc":"xを1個だけ削除する","code":"auto it = S.find(x);\nif(it != S.end()){\n    S.erase(it);\n}","cost":"検索 O(log N) / 位置指定削除はならし O(1)","note":"⚠︎ 「ならし」は、操作を何度も繰り返したときの1回あたりの目安","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    multiset<int> S = {2,5,5}; int x = 5;\n    auto it = S.find(x);\n    if(it != S.end()){\n        S.erase(it);\n    }\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数","example":"","keywords":" 消す 削除 消去 探す 検索 存在"},{"id":"set-9","desc":"最小値を読む","code":"int x = *S.begin();","cost":"O(1)","note":"⚠︎ 容器が空のときは使えない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    set<int> S = {2,5,9};\n    int x = *S.begin();\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"set-10","desc":"最大値を読む","code":"int x = *S.rbegin();","cost":"O(1)","note":"⚠︎ 容器が空のときは使えない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    set<int> S = {2,5,9};\n    int x = *S.rbegin();\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"set-11","desc":"最小値を1個削除する","code":"S.erase(S.begin());","cost":"ならし O(1)","note":"⚠︎ 容器が空のときは使えない 「ならし」は、操作を何度も繰り返したときの1回あたりの目安","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    multiset<int> S = {2,5,5};\n    S.erase(S.begin());\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":" 消す 削除 消去"},{"id":"set-12","desc":"x以上の最小値を探す","code":"auto it = S.lower_bound(x);\nif(it != S.end()){\n    int ans = *it;\n}","cost":"O(log N)","note":"⚠︎ 該当する値がなければendになる。endの中身は読めない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    set<int> S = {2,5,9}; int x = 6;\n    auto it = S.lower_bound(x);\n    if(it != S.end()){\n        int ans = *it;\n    }\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"N：操作前の要素数","example":"","keywords":" 二分探索 ロウワーバウンド"},{"id":"set-13","desc":"xより大きい最小値を探す","code":"auto it = S.upper_bound(x);\nif(it != S.end()){\n    int ans = *it;\n}","cost":"O(log N)","note":"⚠︎ 該当する値がなければendになる。endの中身は読めない","full":"// Reference: https://github.com ions":"B：bit数","example":"","keywords":""},{"id":"io-5","desc":"固定長bit列の1の個数を数える","code":"int cnt = B.count();","cost":"O(Bのbit数)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    bitset<8> B(5);\n    int cnt = B.count();\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"B：bit数","example":"","keywords":" 個数 数える カウント"}]},{"page":"acl","key":"modint","title":"modint：余りを取りながら整数計算","note":"法は998244353か1000000007。大小比較には使えない。出力はval()、入力は通常の整数で受けて代入。","items":[{"id":"modint-1","desc":"998244353で割った余りを管理する","code":"mint x = a;","cost":"O(1)","note":"⚠︎ 法を変えるには全体コードの型の別名を変更","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    long long a = 123;\n    mint x = a;\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"modint-2","desc":"余りを取りながら加減乗算する","code":"mint ans = a*b + c;","cost":"O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    mint a = 10, b = 3, c = 5;\n    mint ans = a*b + c;\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"modint-3","desc":"余りを整数として出力する","code":"cout << x.val() << endl;","cost":"O(1)（桁数固定）","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    mint x = 123;\n    cout << x.val() << endl;\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"","example":"","keywords":""},{"id":"modint-4","desc":"xのn乗の余りを求める","code":"mint ans = x.pow(n);","cost":"O(log n)","note":"⚠︎ n ≥ 0","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    mint x = 3; long long n = 5;\n    mint ans = x.pow(n);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"n：指数","example":"","keywords":" べき乗 累乗 冪乗"},{"id":"modint-5","desc":"逆元を掛ける割り算をする","code":"mint ans = a/b;","cost":"O(log MOD)","note":"⚠︎ 普通の整数の割り算とは異なる。bを法で割った余りが0のときは使えない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    mint a = 10, b = 3;\n    mint ans = a/b;\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"MOD：余りを求めるときの法","example":"","keywords":""},{"id":"modint-6","desc":"余りを管理するDP配列を作る","code":"vector<mint> dp(N+1, 0);","cost":"O(N)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\n\nusing mint = atcoder::modint998244353;\n\nint main(){\n    int N = 5;\n    vector<mint> dp(N+1, 0);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(N)","definitions":"N：指定した要素数","example":"","keywords":""}]},{"page":"acl","key":"acl-extra","title":"math / string：累乗・文字列処理","note":"各機能の詳しい条件はAtCoder Libraryの公式ドキュメントを参照。","items":[{"id":"acl-extra-1","desc":"xのn乗をmで割った余りを求める","code":"long long ans = atcoder::pow_mod(x, n, m);","cost":"O(log n)","note":"⚠︎ n ≥ 0、1 ≤ m ≤ intの最大値","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/math>\nusing namespace std;\n\nint main(){\n    long long x = 3, n = 5; int m = 7;\n    long long ans = atcoder::pow_mod(x, n, m);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(1)","definitions":"n：指数","example":"","keywords":" べき乗 累乗 冪乗"},{"id":"acl-extra-2","desc":"各位置からの接尾辞と先頭が一致する長さを求める","code":"vector<int> Z = atcoder::z_algorithm(S);","cost":"O(N)","note":"⚠︎ Z[i]はSの先頭とS[i..N)の共通接頭辞長","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/string>\nusing namespace std;\n\nint main(){\n    string S = \"ababa\";\n    vector<int> Z = atcoder::z_algorithm(S);\n    return 0;\n}\n","input":"","expected":null,"memory":"O(N)","definitions":"N：文字列の文字数","example":"","keywords":""}]},{"page":"algo","key":"imos","title":"いもす法","reading":"いもすほう","note":"","items":[{"id":"prefix-3","desc":"区間への加算をすべて行った後、各要素の値を求める","code":"D.at(l) += x; D.at(r) -= x;","cost":"時間 O(N+Q) / メモリ O(N)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, Q;\n    cin >> N >> Q;\n    vector<long long> D(N+1, 0);\n    for(int i = 0;i < Q;i++){\n        int l, r;\n        long long x;\n        cin >> l >> r >> x; // 添字l以上r未満\n        D.at(l) += x;\n        D.at(r) -= x;\n    }\n    for(int i = 0;i < N;i++){\n        if(i > 0){\n            D.at(i) += D.at(i-1);\n        }\n        cout << D.at(i) << endl;\n    }\n    return 0;\n}\n","input":"5 1\n1 4 3\n","expected":"0\n3\n3\n3\n0\n","time":"O(N+Q)","memory":"O(N)"}]},{"page":"algo","key":"sieve","title":"エラトステネスの篩","reading":"えらとすてねすのふるい","note":"","items":[{"id":"number-3","desc":"N以下の整数が素数かをまとめて求める","code":"エラトステネスの篩","cost":"時間 O(N log log N) / メモリ O(N)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<char> prime(N+1, true);\n    prime.at(0) = false;\n    if(N >= 1){\n        prime.at(1) = false;\n    }\n    for(long long x = 2;x*x <= N;x++){\n        if(!prime.at(x)){\n            continue;\n        }\n        for(long long y = x*x;y <= N;y += x){\n            prime.at(y) = false;\n        }\n    }\n    for(int x = 2;x <= N;x++){\n        if(prime.at(x)){\n            cout << x << endl;\n        }\n    }\n    return 0;\n}\n","input":"10\n","expected":"2\n3\n5\n7\n","time":"O(N log log N)","memory":"O(N)"}]},{"page":"algo","key":"grid-bfs","title":"グリッドBFS","reading":"ぐりっどびーえふえす","note":"","items":[{"id":"graph-3","desc":"壁のある盤面で、上下左右移動の最短距離を求める","code":"queue<pair<int,int>> Q;","cost":"時間 O(HW) / メモリ O(HW)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int H, W, sh, sw, gh, gw;\n    cin >> H >> W >> sh >> sw >> gh >> gw;\n    vector<string> S(H);\n    for(int h = 0;h < H;h++){\n        cin >> S.at(h);\n    }\n    vector<vector<int>> dist(H, vector<int>(W, -1));\n    queue<pair<int,int>> Q;\n    if(S.at(sh).at(sw) != '#'){\n        dist.at(sh).at(sw) = 0;\n        Q.push({sh, sw});\n    }\n    vector<int> dh = {1,0,-1,0}, dw = {0,1,0,-1};\n    while(!Q.empty()){\n        int h = Q.front().first, w = Q.front().second;\n        Q.pop();\n        for(int k = 0;k < 4;k++){\n            int nh = h+dh.at(k), nw = w+dw.at(k);\n            if(nh < 0 || nh >= H || nw < 0 || nw >= W){\n                continue;\n            }\n            if(S.at(nh).at(nw) == '#' || dist.at(nh).at(nw) != -1){\n                continue;\n            }\n            dist.at(nh).at(nw) = dist.at(h).at(w)+1;\n            Q.push({nh,nw});\n        }\n    }\n    cout << dist.at(gh).at(gw) << endl;\n    return 0;\n}\n","input":"2 3 0 0 1 2\n.#.\n...\n","expected":"3\n","time":"O(HW)","memory":"O(HW)"}]},{"page":"algo","key":"answer-binary-search","title":"答えに対する二分探索","reading":"こたえにたいするにぶんたんさく","note":"","items":[{"id":"answer-search-1","desc":"x² ≥ Kとなる最小整数xを二分探索で求める","code":"while(ok-ng > 1)","cost":"時間 O(log K) / メモリ O(1)","note":"⚠︎ ある値以上なら必ず条件を満たす問題限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: K (1 <= K <= 10^18)\n// 出力: x*x >= K となる最小の非負整数x\nint main(){\n    long long K;\n    cin >> K;\n    long long ng = 0;\n    long long ok = K;\n    while(ok-ng > 1){\n        long long mid = ng + (ok-ng)/2;\n        long long required = K/mid + (K % mid != 0);\n        if(mid >= required){\n            ok = mid;\n        }\n        else{\n            ng = mid;\n        }\n    }\n    cout << ok << endl;\n}\n","input":"20\n","expected":"5\n","time":"O(log K)","memory":"O(1)"}]},{"page":"algo","key":"lis-quadratic","title":"最長増加部分列（二重ループ）","reading":"さいちょうぞうかぶぶんれつにじゅうるーぷ","note":"","items":[{"id":"dp-2","desc":"狭義単調増加部分列の最大長を求める（二重ループ版）","code":"LIS","cost":"時間 O(N²) / メモリ O(N)","note":"⚠︎ 同じ値を続けて選ぶことはできない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n\n    vector<int> dp(N, 1);\n    int ans = 0;\n    for(int i = 0;i < N;i++){\n        for(int j = 0;j < i;j++){\n            if(A.at(j) < A.at(i)){\n                dp.at(i) = max(dp.at(i), dp.at(j)+1);\n            }\n        }\n        ans = max(ans, dp.at(i));\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"4\n3 1 2 5\n","expected":"3\n","time":"O(N²)","memory":"O(N)"}]},{"page":"algo","key":"lis-binary-search","title":"最長増加部分列（二分探索）","reading":"さいちょうぞうかぶぶんれつにぶんたんさく","note":"","items":[{"id":"dp-3","desc":"狭義単調増加部分列の最大長を求める（高速版）","code":"LIS","cost":"時間 O(N log N) / メモリ O(N)","note":"⚠︎ 同じ値を続けて選ぶことはできない。tailの中身は、実際に選べる並びとは限らない。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n\n    vector<int> tail;\n    for(int i = 0;i < N;i++){\n        auto it = lower_bound(tail.begin(), tail.end(), A.at(i));\n        if(it == tail.end()){\n            tail.push_back(A.at(i));\n        }\n        else{\n            *it = A.at(i);\n        }\n    }\n    cout << tail.size() << endl;\n    return 0;\n}\n","input":"4\n3 1 2 5\n","expected":"3\n","time":"O(N log N)","memory":"O(N)"}]},{"page":"algo","key":"coordinate-compression","title":"座標圧縮","reading":"ざひょうあっしゅく","note":"","items":[{"id":"enumeration-3","desc":"値の大小関係を保ったまま、0始まりの順位へ置き換える","code":"lower_bound(B.begin(), B.end(), A.at(i)) - B.begin()","cost":"時間 O(N log N) / メモリ O(N)","note":"⚠︎ 圧縮後の番号の差は、元の値の差にはならない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    vector<long long> B = A;\n    sort(B.begin(), B.end());\n    B.erase(unique(B.begin(), B.end()), B.end());\n    for(int i = 0;i < N;i++){\n        int p = lower_bound(B.begin(), B.end(), A.at(i)) - B.begin();\n        cout << p << endl;\n    }\n    return 0;\n}\n","input":"4\n100 5 100 20\n","expected":"2\n0\n2\n1\n","time":"O(N log N)","memory":"O(N)"}]},{"page":"algo","key":"two-pointers","title":"しゃくとり法","reading":"しゃくとりほう","note":"","items":[{"id":"answer-search-2","desc":"区間の合計がK以下になる、空でない連続部分の個数を数える","code":"ans += r-l;","cost":"時間 O(N) / メモリ O(N)","note":"⚠︎ 配列の値がすべて0以上のとき限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    long long K;\n    cin >> N >> K;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    int r = 0;\n    long long sum = 0, ans = 0;\n    for(int l = 0;l < N;l++){\n        while(r < N && sum + A.at(r) <= K){\n            sum += A.at(r);\n            r++;\n        }\n        ans += r-l;\n        if(r == l){\n            r++;\n        }\n        else{\n            sum -= A.at(l);\n        }\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"3 3\n2 1 3\n","expected":"4\n","time":"O(N)","memory":"O(N)"}]},{"page":"algo","key":"permutation-enumeration","title":"順列全探索","reading":"じゅんれつぜんたんさく","note":"","items":[{"id":"enumeration-2","desc":"配列の値の全順列を列挙する","code":"do{ ... }while(next_permutation(A.begin(), A.end()));","cost":"時間 O(N × N!) / メモリ O(N)","note":"⚠︎ 同じ値を入れ替えただけの並びは、別の並びとして数えない","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    vector<int> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    sort(A.begin(), A.end());\n    do{\n        for(int i = 0;i < N;i++){\n            if(i > 0){\n                cout << \" \";\n            }\n            cout << A.at(i);\n        }\n        cout << endl;\n    }while(next_permutation(A.begin(), A.end()));\n    return 0;\n}\n","input":"2\n2 1\n","expected":"1 2\n2 1\n","time":"O(N × N!)","memory":"O(N)"}]},{"page":"algo","key":"prime-factorization","title":"素因数分解","reading":"そいんすうぶんかい","note":"","items":[{"id":"number-4","desc":"正整数Nを素因数と指数に分解する","code":"while(N % x == 0)","cost":"時間 O(√N) / メモリ O(log N)","note":"⚠︎ 処理後はNの値が変わる。元の値も使うなら先にコピー。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    long long N;\n    cin >> N;\n    vector<pair<long long,int>> factors;\n    for(long long x = 2;x <= N/x;x++){\n        int cnt = 0;\n        while(N % x == 0){\n            N /= x;\n            cnt++;\n        }\n        if(cnt > 0){\n            factors.push_back({x,cnt});\n        }\n    }\n    if(N > 1){\n        factors.push_back({N,1});\n    }\n    for(int i = 0;i < (int)factors.size();i++){\n        cout << factors.at(i).first << \" \" << factors.at(i).second << endl;\n    }\n    return 0;\n}\n","input":"360\n","expected":"2 3\n3 2\n5 1\n","time":"O(√N)","memory":"O(log N)"}]},{"page":"algo","key":"primality-trial","title":"素数判定（試し割り）","reading":"そすうはんていためしわり","note":"","items":[{"id":"number-2","desc":"整数Nが素数か判定する","code":"is_prime(N)","cost":"時間 O(√N) / メモリ O(1)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nbool is_prime(long long N){\n    if(N < 2){\n        return false;\n    }\n    for(long long x = 2;x <= N/x;x++){\n        if(N % x == 0){\n            return false;\n        }\n    }\n    return true;\n}\n\nint main(){\n    long long N;\n    cin >> N;\n    cout << (is_prime(N) ? \"Yes\" : \"No\") << endl;\n    return 0;\n}\n","input":"97\n","expected":"Yes\n","time":"O(√N)","memory":"O(1)"}]},{"page":"algo","key":"dijkstra","title":"ダイクストラ法（Dijkstra）","reading":"だいくすとらほう","note":"","items":[{"id":"graph-2","desc":"一方通行のルートで、頂点1から各頂点までの最小の移動コストを求める","code":"dijkstra","cost":"時間 O((N+M) log(N+M)) / メモリ O(N+M)","note":"⚠︎ 各ルートを通るコストがすべて0以上のとき限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: N M、続いてM本の有向辺 a b cost (頂点は1始まり)\n// N >= 1、cost >= 0、有限の最短距離はINF未満、距離+costはlong long内\n// 出力: 頂点1から各頂点への最短距離。到達不可は-1\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<pair<int, long long>>> G(N);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        long long cost;\n        cin >> a >> b >> cost;\n        a--; b--;\n        G.at(a).push_back({b, cost});\n        // 無向グラフなら次の行も有効にする\n        // G.at(b).push_back({a, cost});\n    }\n    const long long INF = (1LL << 60);\n    vector<long long> dist(N, INF);\n    priority_queue<pair<long long, int>, vector<pair<long long, int>>,\n                   greater<pair<long long, int>>> Q;\n    dist.at(0) = 0;\n    Q.push({0, 0});\n    while(!Q.empty()){\n        long long d = Q.top().first;\n        int v = Q.top().second;\n        Q.pop();\n        if(d != dist.at(v)){\n            continue;\n        }\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i).first;\n            long long cost = G.at(v).at(i).second;\n            if(dist.at(to) > d+cost){\n                dist.at(to) = d+cost;\n                Q.push({dist.at(to), to});\n            }\n        }\n    }\n    for(int i = 0;i < N;i++){\n        if(dist.at(i) == INF){\n            cout << -1 << endl;\n        }\n        else{\n            cout << dist.at(i) << endl;\n        }\n    }\n}\n","input":"4 3\n1 2 8\n1 3 2\n3 2 1\n","expected":"0\n3\n2\n-1\n","time":"O((N+M) log(N+M))","memory":"O(N+M)"}]},{"page":"algo","key":"stair-dp","title":"動的計画法（階段）","reading":"どうてきけいかくほうかいだん","note":"","items":[{"id":"dp-1","desc":"1段・2段ずつN段上る方法の数を余りで求める","code":"dp.at(i) = dp.at(i+1)+dp.at(i+2);","cost":"時間 O(N) / メモリ O(N)","note":"⚠︎ 余りは998244353で計算する。AtCoder Libraryが必要。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\n#include <atcoder/modint>\nusing namespace std;\nusing mint = atcoder::modint998244353;\n\n// 入力: N (0 <= N <= 10^6 を想定)\n// 出力: 1段/2段ずつN段上る方法の数を998244353で割った余り\nint main(){\n    int N;\n    cin >> N;\n    vector<mint> dp(N+2, 0);\n    dp.at(N) = 1;\n    for(int i = N-1;i >= 0;i--){\n        dp.at(i) = dp.at(i+1) + dp.at(i+2);\n    }\n    cout << dp.at(0).val() << endl;\n}\n","input":"5\n","expected":"8\n","time":"O(N)","memory":"O(N)"}]},{"page":"algo","key":"knapsack","title":"動的計画法（ナップザック）","reading":"どうてきけいかくほうなっぷざっく","note":"","items":[{"id":"dp-4","desc":"各品物を1個まで選び、重さW以下で価値の和を最大化する","code":"dp.at(w) = max(dp.at(w), dp.at(w-weight)+value);","cost":"時間 O(NW) / メモリ O(W)","note":"⚠︎ 重さは0以上の整数限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, W;\n    cin >> N >> W;\n    vector<long long> dp(W+1, 0);\n    for(int i = 0;i < N;i++){\n        int weight;\n        long long value;\n        cin >> weight >> value;\n        for(int w = W;w >= weight;w--){\n            dp.at(w) = max(dp.at(w), dp.at(w-weight)+value);\n        }\n    }\n    cout << dp.at(W) << endl;\n    return 0;\n}\n","input":"3 5\n2 3\n3 4\n4 5\n","expected":"7\n","time":"O(NW)","memory":"O(W)"}]},{"page":"algo","key":"topological-sort","title":"トポロジカルソート","reading":"とぽろじかるそーと","note":"","items":[{"id":"graph-4","desc":"有向辺の前後関係を守る順番を求める","code":"入次数0の頂点からqueueで取り出す","cost":"時間 O(N+M) / メモリ O(N+M)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<int>> G(N);\n    vector<int> indeg(N, 0);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        cin >> a >> b;\n        a--; b--;\n        G.at(a).push_back(b);\n        indeg.at(b)++;\n    }\n    queue<int> Q;\n    for(int v = 0;v < N;v++){\n        if(indeg.at(v) == 0){\n            Q.push(v);\n        }\n    }\n    vector<int> order;\n    while(!Q.empty()){\n        int v = Q.front();\n        Q.pop();\n        order.push_back(v);\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i);\n            indeg.at(to)--;\n            if(indeg.at(to) == 0){\n                Q.push(to);\n            }\n        }\n    }\n    if((int)order.size() != N){\n        cout << -1 << endl;\n    }\n    else{\n        for(int i = 0;i < N;i++){\n            cout << order.at(i)+1 << endl;\n        }\n    }\n    return 0;\n}\n","input":"3 2\n1 2\n2 3\n","expected":"1\n2\n3\n","time":"O(N+M)","memory":"O(N+M)"}]},{"page":"algo","key":"prefix-sum-2d","title":"二次元累積和","reading":"にじげんるいせきわ","note":"","items":[{"id":"prefix-2","desc":"二次元配列の長方形内の和を求める","code":"S.at(h2).at(w2)-S.at(h1).at(w2)-S.at(h2).at(w1)+S.at(h1).at(w1)","cost":"時間 O(HW+Q) / メモリ O(HW)","note":"⚠︎ 盤面の値を途中で書き換えないとき限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int H, W, Q;\n    cin >> H >> W >> Q;\n    vector<vector<long long>> S(H+1, vector<long long>(W+1, 0));\n    for(int h = 0;h < H;h++){\n        for(int w = 0;w < W;w++){\n            long long x;\n            cin >> x;\n            S.at(h+1).at(w+1) = x + S.at(h).at(w+1) + S.at(h+1).at(w) - S.at(h).at(w);\n        }\n    }\n    for(int i = 0;i < Q;i++){\n        int h1, w1, h2, w2;\n        cin >> h1 >> w1 >> h2 >> w2; // 行[h1,h2)、列[w1,w2)\n        long long ans = S.at(h2).at(w2)-S.at(h1).at(w2)-S.at(h2).at(w1)+S.at(h1).at(w1);\n        cout << ans << endl;\n    }\n    return 0;\n}\n","input":"2 2 1\n1 2\n3 4\n0 1 2 2\n","expected":"6\n","time":"O(HW+Q)","memory":"O(HW)"}]},{"page":"algo","key":"bfs","title":"幅優先探索（BFS）","reading":"はばゆうせんたんさく","note":"","items":[{"id":"graph-1","desc":"無向・重みなしグラフで頂点1からの最短距離を求める","code":"bfs","cost":"時間 O(N+M) / メモリ O(N+M)","note":"⚠︎ すべてのルートを同じ1回の移動として数えられるとき限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\n// 入力: N M、続いてM本の無向辺 a b (頂点は1始まり)。N >= 1\n// 出力: 頂点1から各頂点への最短距離。到達不可は-1\nint main(){\n    int N, M;\n    cin >> N >> M;\n    vector<vector<int>> G(N);\n    for(int i = 0;i < M;i++){\n        int a, b;\n        cin >> a >> b;\n        a--; b--;\n        G.at(a).push_back(b);\n        G.at(b).push_back(a);\n    }\n    vector<int> dist(N, -1);\n    queue<int> Q;\n    dist.at(0) = 0;\n    Q.push(0);\n    while(!Q.empty()){\n        int v = Q.front();\n        Q.pop();\n        for(int i = 0;i < (int)G.at(v).size();i++){\n            int to = G.at(v).at(i);\n            if(dist.at(to) != -1){\n                continue;\n            }\n            dist.at(to) = dist.at(v)+1;\n            Q.push(to);\n        }\n    }\n    for(int i = 0;i < N;i++){\n        cout << dist.at(i) << endl;\n    }\n}\n","input":"4 2\n1 2\n2 3\n","expected":"0\n1\n2\n-1\n","time":"O(N+M)","memory":"O(N+M)"}]},{"page":"algo","key":"bit-enumeration","title":"ビット全探索","reading":"びっとぜんたんさく","note":"","items":[{"id":"enumeration-1","desc":"各要素を選ぶ・選ばない全組合せで、和がKになる数を数える","code":"if((bit >> i) & 1LL)","cost":"時間 O(N × 2ᴺ) / メモリ O(N)","note":"⚠︎ 何も選ばない場合も数える。Nは20前後までが目安。","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    long long K;\n    cin >> N >> K;\n    vector<long long> A(N);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n    }\n    long long ans = 0;\n    for(long long bit = 0;bit < (1LL << N);bit++){\n        long long sum = 0;\n        for(int i = 0;i < N;i++){\n            if((bit >> i) & 1LL){\n                sum += A.at(i);\n            }\n        }\n        if(sum == K){\n            ans++;\n        }\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"3 5\n2 3 5\n","expected":"2\n","time":"O(N × 2ᴺ)","memory":"O(N)"}]},{"page":"algo","key":"equal-pair-count","title":"ペア数の数え上げ（同じ値）","reading":"ぺあすうのかぞえあげおなじあたい","note":"","items":[{"id":"enumeration-4","desc":"同じ値を持つ添字のペア数を求める","code":"num * (num-1) / 2","cost":"時間 O(N log N) / メモリ O(値の種類数)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N;\n    cin >> N;\n    map<long long, long long> cnt;\n    for(int i = 0;i < N;i++){\n        long long x;\n        cin >> x;\n        cnt[x]++;\n    }\n    long long ans = 0;\n    for(auto it = cnt.begin();it != cnt.end();it++){\n        long long num = it->second;\n        ans += num*(num-1)/2;\n    }\n    cout << ans << endl;\n    return 0;\n}\n","input":"5\n2 2 2 3 3\n","expected":"4\n","time":"O(N log N)","memory":"O(値の種類数)"}]},{"page":"algo","key":"divisors","title":"約数列挙","reading":"やくすうれっきょ","note":"","items":[{"id":"number-1","desc":"正整数Nの約数を昇順に列挙する","code":"for(long long x = 1;x <= N/x;x++)","cost":"時間 O(√N + D log D) / メモリ O(D)","note":"","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    long long N;\n    cin >> N;\n    vector<long long> D;\n    for(long long x = 1;x <= N/x;x++){\n        if(N % x == 0){\n            D.push_back(x);\n            if(x != N/x){\n                D.push_back(N/x);\n            }\n        }\n    }\n    sort(D.begin(), D.end());\n    for(int i = 0;i < (int)D.size();i++){\n        cout << D.at(i) << endl;\n    }\n    return 0;\n}\n","input":"12\n","expected":"1\n2\n3\n4\n6\n12\n","time":"O(√N + D log D)","memory":"O(D)","cost_definition":"Dは約数の個数"}]},{"page":"algo","key":"prefix-sum","title":"累積和","reading":"るいせきわ","note":"","items":[{"id":"prefix-1","desc":"更新なしの配列で、区間の和を繰り返し求める","code":"S.at(r) - S.at(l)","cost":"時間 O(N+Q) / メモリ O(N)","note":"⚠︎ 配列の値を途中で書き換えないとき限定","full":"// Reference: https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    int N, Q;\n    cin >> N >> Q;\n    vector<long long> A(N), S(N+1, 0);\n    for(int i = 0;i < N;i++){\n        cin >> A.at(i);\n        S.at(i+1) = S.at(i) + A.at(i);\n    }\n    for(int i = 0;i < Q;i++){\n        int l, r;\n        cin >> l >> r; // 添字l以上r未満\n        cout << S.at(r)-S.at(l) << endl;\n    }\n    return 0;\n}\n","input":"4 3\n3 1 4 2\n1 3\n0 4\n2 2\n","expected":"5\n10\n0\n","time":"O(N+Q)","memory":"O(N)"}]}],"limits":[{"key":"time-guide","title":"計算量：制約から見る候補","content":"<div class=\"table-wrap\"><table><thead><tr><th>入力規模<\/th><th>候補になる計算量<\/th><\/tr><\/thead><tbody><tr><td>N ≲ 10<\/td><td>O(N × N!)<\/td><\/tr><tr><td>N ≲ 20<\/td><td>O(N × 2ᴺ)<\/td><\/tr><tr><td>N ≲ 3×10³<\/td><td>O(N²)<\/td><\/tr><tr><td>N ≲ 2×10⁵<\/td><td>O(N log N)、O(N)<\/td><\/tr><tr><td>値の範囲が10⁹〜10¹⁸<\/td><td>二分探索・数式など。値を1ずつ列挙しない<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">制限時間・処理内容・定数倍で変わる目安。秒数の保証ではない。<\/p>"},{"key":"time-count","title":"計算量計算機","content":"<div class=\"table-wrap\"><table><thead><tr><th>N / O(N)<\/th><th>N log₂N<\/th><th>N²<\/th><th>N³<\/th><\/tr><\/thead><tbody><tr><td>10²<\/td><td>6.6×10²<\/td><td>10⁴<\/td><td>10⁶<\/td><\/tr><tr><td>10³<\/td><td>10×10³<\/td><td>10⁶<\/td><td>10⁹<\/td><\/tr><tr><td>3×10³<\/td><td>3.5×10⁴<\/td><td>9×10⁶<\/td><td>2.7×10¹⁰<\/td><\/tr><tr><td>10⁴<\/td><td>1.3×10⁵<\/td><td>10⁸<\/td><td>10¹²<\/td><\/tr><tr><td>2×10⁵<\/td><td>3.5×10⁶<\/td><td>4×10¹⁰<\/td><td>8×10¹⁵<\/td><\/tr><tr><td>10⁶<\/td><td>2×10⁷<\/td><td>10¹²<\/td><td>10¹⁸<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th>N<\/th><th>2ᴺ<\/th><th>N × 2ᴺ<\/th><th>N!<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>1×10³<\/td><td>1×10⁴<\/td><td>3.6×10⁶<\/td><\/tr><tr><td>15<\/td><td>3.3×10⁴<\/td><td>4.9×10⁵<\/td><td>1.3×10¹²<\/td><\/tr><tr><td>20<\/td><td>1×10⁶<\/td><td>2.1×10⁷<\/td><td>2.4×10¹⁸<\/td><\/tr><tr><td>25<\/td><td>3.4×10⁷<\/td><td>8.4×10⁸<\/td><td>1.6×10²⁵<\/td><\/tr><tr><td>30<\/td><td>1.1×10⁹<\/td><td>3.2×10¹⁰<\/td><td>2.7×10³²<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">実際のCPU命令数ではなく、計算量の式の値。文字列コピーやmap操作などは単純な加算より重い。<\/p>","tool":"time"},{"key":"memory-calculator","title":"メモリ計算機","tool":"memory","content":"<p>コンテナを選択してメモリ容量を計算する。配列（vector）は一次元／二次元を切り替えられる。set・multiset・map・unordered_set・unordered_mapにも対応し、管理領域込みの推定容量を選択式のメモリ制限と比較する。<\/p>"},{"key":"type-memory","title":"型と配列のメモリ","content":"<div class=\"table-wrap\"><table><thead><tr><th>型<\/th><th>1要素の目安<\/th><th>10⁵要素<\/th><th>10⁶要素<\/th><th>10⁷要素<\/th><\/tr><\/thead><tbody><tr><td>char<\/td><td>0.000001 MB<\/td><td>0.1 MB<\/td><td>1 MB<\/td><td>10 MB<\/td><\/tr><tr><td>int<\/td><td>0.000004 MB<\/td><td>0.4 MB<\/td><td>4 MB<\/td><td>40 MB<\/td><\/tr><tr><td>long long / double<\/td><td>0.000008 MB<\/td><td>0.8 MB<\/td><td>8 MB<\/td><td>80 MB<\/td><\/tr><tr><td>pair&lt;int,int&gt;<\/td><td>通常0.000008 MB<\/td><td>約0.8 MB<\/td><td>約8 MB<\/td><td>約80 MB<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">要素本体の容量を、一般的なGCC環境で見積もった表。実際の型のサイズはsizeofで確認できます。<\/p>"},{"key":"matrix-memory","title":"二次元配列のメモリ","content":"<div class=\"table-wrap\"><table><thead><tr><th>H × W<\/th><th>要素数<\/th><th>int<\/th><th>long long / double<\/th><\/tr><\/thead><tbody><tr><td>10² × 10²<\/td><td>10⁴<\/td><td>0.04 MB<\/td><td>0.08 MB<\/td><\/tr><tr><td>10³ × 10³<\/td><td>10⁶<\/td><td>4 MB<\/td><td>8 MB<\/td><\/tr><tr><td>2×10³ × 2×10³<\/td><td>4×10⁶<\/td><td>16 MB<\/td><td>32 MB<\/td><\/tr><tr><td>3×10³ × 3×10³<\/td><td>9×10⁶<\/td><td>36 MB<\/td><td>72 MB<\/td><\/tr><tr><td>5×10³ × 5×10³<\/td><td>2.5×10⁷<\/td><td>100 MB<\/td><td>200 MB<\/td><\/tr><tr><td>10⁴ × 10⁴<\/td><td>10⁸<\/td><td>400 MB<\/td><td>800 MB<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">要素本体の容量。vector&lt;vector&lt;T&gt;&gt;には行ごとのvector管理領域・確保処理も加わる。大きなローカル固定長配列はスタック上限にも注意し、vectorを使う。<\/p>"},{"key":"memory-limit","title":"メモリ上限との比較","content":"<div class=\"table-wrap\"><table><thead><tr><th>上限<\/th><th>intだけで使い切る理論要素数<\/th><th>正方形int配列の理論最大辺長<\/th><\/tr><\/thead><tbody><tr><td>256 MB<\/td><td>約6.4×10⁷<\/td><td>8000<\/td><\/tr><tr><td>512 MB<\/td><td>約1.3×10⁸<\/td><td>11313<\/td><\/tr><tr><td>1024 MB<\/td><td>約2.6×10⁸<\/td><td>16000<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">計算機と同じMB基準で、上限を256・512・1024 MBとした理論値。安全な確保量ではない。実行環境・他の変数・コピー・管理領域の分を差し引く。<\/p><p>合計容量 ≈ 各配列の容量の合計 + 管理領域。intのN×N配列をコピーすれば、本体だけでN² × 0.000008 MB。long longのN×N累積和なら約(N+1)² × 0.000008 MB。<\/p>"},{"key":"memory-extra","title":"容器・グラフ・コピーの注意","content":"<div class=\"table-wrap\"><table><thead><tr><th>対象<\/th><th>容量の見積もり<\/th><\/tr><\/thead><tbody><tr><td>vector&lt;T&gt;<\/td><td>確保済みcapacity × sizeof(T) ÷ 10⁶ MB + 管理領域。sizeだけでは正確に見積もれない<\/td><\/tr><tr><td>vector&lt;vector&lt;T&gt;&gt;<\/td><td>各行のcapacity × sizeof(T) ÷ 10⁶ MB + H個のvector管理領域 + 各確保の管理領域<\/td><\/tr><tr><td>map / set / multiset<\/td><td>ノードごとの参照などで、値本体より大きくなる。要素数 × sizeof(値) ÷ 10⁶ MBだけでは不足<\/td><\/tr><tr><td>unordered_map / unordered_set<\/td><td>要素ノードに加え、バケット配列も必要<\/td><\/tr><tr><td>無向グラフの隣接リスト<\/td><td>頂点数N、辺数Mの場合、intの行き先を通常2M個持つ。本体約M × 0.000008 MB + N個のvectorなど<\/td><\/tr><tr><td>vector&lt;bool&gt;<\/td><td>一般にbit圧縮。通常のbool配列とは扱いが異なる。分かりやすさ重視ならvector&lt;char&gt;<\/td><\/tr><tr><td>関数の引数<\/td><td>vector&lt;int&gt; Aはコピー。const vector&lt;int&gt;&amp; Aなら読むだけで参照<\/td><\/tr><tr><td>再帰DFS<\/td><td>呼び出しごとのスタックも消費。深いグラフではstackなどの反復実装を検討<\/td><\/tr><\/tbody><\/table><\/div>"},{"key":"sizeof","title":"sizeof：実際の型のサイズを確認","content":"<p>型本体の容量をMB単位で出力する。sizeof(vector&lt;int&gt;)は要素本体を含まない。<\/p><details class=\"code-only\"><summary>全体コードを開く<\/summary><pre><code>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main(){\n    cout &lt;&lt; fixed &lt;&lt; setprecision(6);\n    cout &lt;&lt; sizeof(int) / 1000000.0 &lt;&lt; &quot; MB&quot; &lt;&lt; endl;\n    cout &lt;&lt; sizeof(long long) / 1000000.0 &lt;&lt; &quot; MB&quot; &lt;&lt; endl;\n    cout &lt;&lt; sizeof(double) / 1000000.0 &lt;&lt; &quot; MB&quot; &lt;&lt; endl;\n    cout &lt;&lt; sizeof(vector&lt;int&gt;) / 1000000.0 &lt;&lt; &quot; MB&quot; &lt;&lt; endl;\n    return 0;\n}\n<\/code><\/pre><\/details>"}],"notes":[{"id":"20261108-algorithm-labels","at":"2026-11-08 10:57","title":"アルゴリズムのカテゴリ名とDPの目次名を整理","category":"アルゴリズム","text":"カテゴリ名を「アルゴリズム」に変更しました。階段DPとナップザックDPは「動的計画法（階段）」「動的計画法（ナップザック）」とし、DPの種類が目次で分かる名前にしました。","published":true,"kind":"updates"},{"id":"20261108-time-count-labels","at":"2026-11-08 10:31","title":"計算量計算機の見出しと回数表示を整理","category":"計算量・メモリ","text":"表の見出しを「計算式」「計算回数」に変更し、各数値の後ろに「回」を付けました。目安であることは表の下に記載しています。","published":true,"kind":"updates"},{"id":"20261108-time-prefix","at":"2026-11-08 10:23","title":"計算量計算機の「約」を削除","category":"計算量・メモリ","text":"計算量計算機の結果から「約」を省き、数値と指数だけを表示するようにしました。","published":true,"kind":"updates"},{"id":"20261108-keyboard-caret","at":"2026-11-08 10:13","title":"計算機の入力欄を通常キーボードに変更","category":"計算量・メモリ","text":"要素数・行数・列数・個数の入力でテンキーを優先する設定を解除し、通常キーボードを使う設定にしました。iPhoneの空白長押しによるカーソル移動を使って、途中の桁を編集しやすくします。","published":true,"kind":"updates"},{"id":"20261108-memory-readable","at":"2026-11-08 10:08","title":"使用メモリ量の表示を整理し、メモリの表をMBに統一","category":"計算量・メモリ","text":"計算機の結果を「使用メモリ量 : 推定容量 / 制限」と割合の2行にまとめました。メモリの表は各容量セルにMBを残して統一し、小さい容量もMBに換算しました。上限比較表は計算機と同じMB条件で再計算しました。","published":true,"kind":"updates"},{"id":"20261108-memory-mb","at":"2026-11-08 09:52","title":"メモリ計算機の単位と割合表示を簡略化","category":"計算量・メモリ","text":"メモリ計算機の結果と制限の選択肢をMBに統一しました。制限に対する割合は、推定範囲の大きい方から計算した数字だけを表示します。","published":true,"kind":"updates"},{"id":"20261108-type-labels","at":"2026-11-08 09:40","title":"メモリ計算機の型名表示を簡略化","category":"計算量・メモリ","text":"値・キーの型の選択肢をchar・int・long long・doubleの型名だけにし、1 B・4 B・8 Bの補足を省きました。","published":true,"kind":"updates"},{"id":"20261108-container-selection","at":"2026-11-08 09:36","title":"メモリ計算機のコンテナ選択を整理","category":"計算量・メモリ","text":"配列とvectorを「配列（vector）」に一本化し、選択欄の名称を「コンテナ」に変更しました。初期状態を未選択にし、選ぶまでは次元・数値の入力欄や計算結果を表示しないようにしました。","published":true,"kind":"updates"},{"id":"20261108-memory-containers","at":"2026-11-08 08:02","title":"メモリ計算機に次元切替とコンテナ選択を追加","category":"計算量・メモリ","text":"一次元配列と二次元配列をボタンで選べるようにし、long longとdoubleを別の選択肢にしました。vector・set・multiset・map・unordered_set・unordered_mapに対応しました。mapではキーと値の型を別々に選択できます。コンテナは管理領域込みの推定容量と、保存する値本体の容量を表示します。","published":true,"kind":"updates"},{"id":"20261108-calculator-buttons","at":"2026-11-08 07:45","title":"計算機を目次上部の専用ボタンに変更","category":"計算量・メモリ","text":"メモリ計算機と計算量計算機を、知識の目次とは区切った専用ボタンとして目次上部に配置しました。ボタンを押すと本文にその計算機だけを表示します。","published":true,"kind":"updates"},{"id":"20261108-empty-category","at":"2026-11-08 07:09","title":"カテゴリ選択時の本文の自動表示を廃止","category":"サイト全体","text":"カテゴリを選んだ直後は本文を表示せず、「目次から項目を選んでください」と案内するようにしました。vectorなどのくくりを開くだけでは本文を表示せず、個別項目を選んでから内容を表示します。","published":true,"kind":"updates"},{"id":"20261108-mobile-toc","at":"2026-11-08 07:00","title":"スマホの目次の開閉と移動を改善","category":"サイト全体","text":"スマホでカテゴリを選ぶと、子項目のくくりを閉じた目次を開くようにしました。vectorなどのくくりを押したときは目次の位置にとどまり、個別の項目を選んだときだけ本文の先頭へ移動します。","published":true,"kind":"updates"},{"id":"20261108-operation-reference","at":"2026-11-08 06:48","title":"標準ライブラリ・ACLと計算ツールを改善","category":"標準ライブラリ / AtCoder Library / 計算量・メモリ","text":"目次から操作を1つずつ選ぶ表示に変更しました。全体コードの常時表示、短いコードのコピー、追加メモリ、計算量の文字の意味、平易な注意点、実行前後の例、日本語や別名での検索を追加しました。配列のメモリ容量と選択式のメモリ制限の比較、Nを選択する計算量の比較にも対応しました。","published":true,"kind":"updates"},{"id":"20261108-notes-added","at":"2026-11-08 06:19","title":"更新履歴・制作者メモの記録場所を追加","category":"サイト全体","text":"更新履歴と制作者メモをソース側で管理できるようにしました。公開フラグを付けた記録だけがサイトに表示されます。","published":true,"kind":"updates"}],"source":"https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference"}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('reference-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entries = new Map(DATA.groups.flatMap(g => g.items.map(i => [i.id,i])));
let page = 'std', timer, query = '';
let selectedTocHref = '';
function syncTocHighlight(){
    document.querySelectorAll('.side-link').forEach(link=>{
        const selected=link.getAttribute('href')===selectedTocHref;
        link.classList.toggle('current',selected);
        if(selected){link.setAttribute('aria-current','location');}
        else{link.removeAttribute('aria-current');}
    });
}
function clearTocHighlight(){
    selectedTocHref='';syncTocHighlight();
}
function notify(message){ $('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200); }
function sourceNote(){return '<footer><a href="'+DATA.source+'" target="_blank" rel="noopener">公開ソース・共通の前提</a> · <a href="https://info.atcoder.jp/entry/llm-rules-ja" target="_blank" rel="noopener">AtCoderの利用ルール</a></footer>';}
function fullCode(i){
    return '<div class="full-code"><div class="code-toolbar"><span>C++23 (GCC 15.2.0) · #include / main() を含む全体コード</span><div class="code-actions"><button type="button" class="copy" data-copy="'+i.id+'">全体コードをコピー</button><button type="button" class="download" data-download="'+i.id+'">C++ファイルを保存</button></div></div><pre><code>'+esc(i.full)+'</code></pre></div>';
}
function operation(i, algo, groupNote=''){
    if(algo){
        const notes=[groupNote,i.note].filter(Boolean).join(' ');
        return '<article class="algorithm-entry" id="'+i.id+'"><p class="algorithm-purpose"><strong>目的</strong> : '+esc(i.desc)+'</p><p class="algorithm-cost">計算量 '+esc(i.time)+'　 /　 メモリ '+esc(i.memory)+(i.cost_definition?'　（'+esc(i.cost_definition)+'）':'')+'</p>'+(notes?'<p class="section-note">'+esc(notes)+'</p>':'')+fullCode(i)+'</article>';
    }
    return '<article class="operation-entry" id="'+i.id+'-operation"><p class="algorithm-purpose">機能 : '+esc(i.desc)+'</p><div class="operation-short"><pre><code>'+esc(i.code)+'</code></pre><div class="code-actions"><button type="button" class="copy" data-shortcopy="'+i.id+'">この部分をコピー</button></div></div><p class="operation-cost">計算量 '+esc(i.cost)+'　 /　 追加メモリ '+esc(i.memory)+'</p>'+(i.definitions?'<p class="symbol-definitions">'+esc(i.definitions)+'</p>':'')+(i.note?'<p class="section-note">'+esc(i.note)+'</p>':'')+(i.example?'<pre class="operation-example">'+esc(i.example)+'</pre>':'')+fullCode(i)+'</article>';
}
function section(g, items){
    const algo=g.page==='algo';
    return '<section class="section '+(algo?'algo':'')+'" id="'+g.key+'"><h2>'+esc(g.title)+'<a href="#'+g.page+'/'+g.key+'" aria-label="この項目のリンク">#</a></h2>'+(g.note&&!algo?'<p class="section-note">'+esc(g.note)+'</p>':'')+(algo?'':'<div class="operations"><div class="column-head"><span>機能</span><span>コード</span><span>計算量</span><span>展開</span></div>')+items.map(i=>operation(i,algo,g.note)).join('')+(algo?'':'</div>')+'</section>';
}
function noteSection(n){return '<section class="section" id="'+esc(n.id)+'"><h2>'+esc(n.title)+'</h2><p class="section-note">'+esc(n.at)+' JST　 /　 '+esc(n.category)+'</p><p>'+esc(n.text)+'</p></section>';}
function termsMatch(text){const t=text.toLocaleLowerCase();return query.trim().toLocaleLowerCase().split(/\s+/).every(q=>t.includes(q));}
const calcState={kind:'',dimension:'1',type:'int',keyType:'int',valueType:'int',size:'100000',rows:'2000',cols:'3000',count:'1',limit:'1024',n:'200000'};
const memoryTypes={char:{label:'char',bytes:1n,align:1n},int:{label:'int',bytes:4n,align:4n},longlong:{label:'long long',bytes:8n,align:8n},double:{label:'double',bytes:8n,align:8n}};
const memoryKinds=[['','選択してください'],['vector','配列（vector）'],['set','set'],['multiset','multiset'],['map','map'],['unordered_set','unordered_set'],['unordered_map','unordered_map']];
function options(values,current){return values.map(([v,t])=>'<option value="'+v+'"'+(String(v)===current?' selected':'')+'>'+t+'</option>').join('');}
function memoryField(key,label){return '<label>'+label+'<input data-calc="'+key+'" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" value="'+esc(calcState[key])+'"></label>';}
function memoryTypeField(key,label){return '<label>'+label+'<select data-calc="'+key+'">'+options(Object.entries(memoryTypes).map(([k,t])=>[k,t.label]),calcState[key])+'</select></label>';}
function memoryToolContent(){
    const array=calcState.kind==='vector',map=calcState.kind.endsWith('map');
    const selector='<div class="calc-fields"><label>コンテナ<select data-calc="kind">'+options(memoryKinds,calcState.kind)+'</select></label></div>';
    if(!calcState.kind)return selector;
    return selector+(array?'<div class="dimension-controls" role="group" aria-label="配列の次元">'+[['1','一次元配列'],['2','二次元配列']].map(([k,t])=>'<button type="button" class="copy" data-dimension="'+k+'" aria-pressed="'+(calcState.dimension===k)+'">'+t+'</button>').join('')+'</div>':'')+'<div class="calc-fields">'+(map?memoryTypeField('keyType','キーの型')+memoryTypeField('valueType','値の型'):memoryTypeField('type','値の型'))+(array&&calcState.dimension==='2'?memoryField('rows','行数')+memoryField('cols','列数'):memoryField('size',map||calcState.kind==='set'||calcState.kind==='unordered_set'?'要素数（異なるキー・値の個数）':'要素数'))+memoryField('count',array?'配列の個数':'コンテナの個数')+'<label>問題のメモリ制限<select data-calc="limit">'+options([256,512,1024,2048].map(v=>[v,v+' MB']),calcState.limit)+'</select></label></div><div class="calc-output" id="memory-result" aria-live="polite"></div><div id="memory-assumptions"></div><p>メモリ制限は問題文を確認して選択してください。</p>';
}
function memoryTool(){return '<div id="memory-panel">'+memoryToolContent()+'</div>';}
const alignBytes=(v,a)=>(v+a-1n)/a*a;
const allocationBytes=v=>{const n=alignBytes(v+8n,16n);return n<32n?32n:n;};
function memoryEstimate(state){
    if(!state.kind||!memoryKinds.some(([kind])=>kind===state.kind))return {unselected:true};
    const array=state.kind==='vector',map=state.kind.endsWith('map'),two=array&&state.dimension==='2';
    const keys=two?['rows','cols','count']:['size','count'];
    if(keys.some(k=>!/^\d{1,12}$/.test(state[k])||BigInt(state[k])<1n))return {error:'要素数・行数・列数・個数には、1以上の整数を入力してください。'};
    const copies=BigInt(state.count),rows=two?BigInt(state.rows):1n,n=two?rows*BigInt(state.cols):BigInt(state.size);
    let value=memoryTypes[state.type].bytes;
    if(map){const k=memoryTypes[state.keyType],v=memoryTypes[state.valueType];value=alignBytes(alignBytes(k.bytes,v.align)+v.bytes,k.align>v.align?k.align:v.align);}
    const payload=n*value*copies;
    let low=payload,high=payload,assumption='要素本体の容量。ほかの変数や実行環境の使用量は含まない。';
    if(state.kind==='vector'){
        const valueBytes=memoryTypes[state.type].bytes;
        const base=two?24n+allocationBytes(rows*24n)+rows*allocationBytes(BigInt(state.cols)*valueBytes):24n+allocationBytes(n*valueBytes);
        low=base*copies;high=(base+16n*(two?rows+1n:1n))*copies;
        assumption='capacityを要素数ちょうどにしたvectorを想定。二次元はvector<vector<T>>として各行の管理領域も計算。push_backなどで余分な容量を確保した場合は、この値より増える。';
    }else if(state.kind==='set'||state.kind==='multiset'||state.kind==='map'){
        const node=alignBytes(32n+value,8n);
        low=(allocationBytes(node)*n+48n)*copies;high=((allocationBytes(node)+16n)*n+48n)*copies;
        assumption='各要素に木の管理情報を持つGCCの一般的な実装を想定。要素数はset・mapでは重複を除いた個数、multisetでは重複も数える。';
    }else if(state.kind.startsWith('unordered_')){
        const node=alignBytes(8n+value,8n);
        low=(allocationBytes(node)*n+allocationBytes(8n*n)+56n)*copies;high=((allocationBytes(node)+16n)*n+allocationBytes(16n*n)+16n+56n)*copies;
        assumption='標準のハッシュ関数を使い、バケット数を要素数の約1〜2倍として見積もる。reserve・rehash・max_load_factorの設定や再確保の途中では、この範囲から外れることがある。';
    }
    return {payload,low,high,estimated:true,assumption};
}
function memoryBytes(n){return (Number(n)/1e6).toLocaleString('ja-JP',{maximumSignificantDigits:5})+' MB';}
function updateMemory(){
    const result=$('#memory-result');if(!result)return;
    const estimate=memoryEstimate(calcState),help=$('#memory-assumptions');
    if(estimate.unselected){result.textContent='';if(help)help.textContent='';return;}
    if(estimate.error){result.textContent=estimate.error;if(help)help.textContent='';return;}
    const {payload,low,high,estimated,assumption}=estimate,limit=BigInt(calcState.limit)*1000000n;
    const percent=n=>(Number(n)/Number(limit)*100).toLocaleString('ja-JP',{maximumSignificantDigits:4});
    result.innerHTML='使用メモリ量 : '+memoryBytes(high)+' / '+calcState.limit+' MB<br>制限に対する割合 : 約'+percent(high)+'％';
    if(help)help.innerHTML=(high>limit?'<p>推定使用メモリ量がメモリ制限を超えています。</p>':'')+'<p>'+esc(assumption)+'</p>'+(estimated?'<p>64 bit Linux・GCC系の一般的な実装での概算。使用メモリ量と割合には、大きい方の推定値を使っています。実測値や絶対的な上限ではありません。確保処理の管理分や配置の隙間も考慮しているが、ほかの変数・再確保中の一時領域などは別に必要。</p><details><summary>見積もりの前提</summary><p>参照やノードの管理情報、mapのキーと値の間の隙間、メモリ確保の最小単位や管理分を考慮したモデルです。確保処理の違いを見込み、大きい方の推定値を採用しています。</p><p><a href="https://gcc.gnu.org/onlinedocs/gcc-15.2.0/libstdc%2B%2B/api/a00413_source.html" target="_blank" rel="noopener">GCCの木構造の実装</a> · <a href="https://gcc.gnu.org/onlinedocs/gcc-15.2.0/libstdc%2B%2B/api/a18194_source.html" target="_blank" rel="noopener">ハッシュ表の実装</a> · <a href="https://github.com/bminor/glibc/blob/master/malloc/malloc.c" target="_blank" rel="noopener">メモリ確保処理の実装</a></p></details>':'');
}
function refreshMemory(){const panel=$('#memory-panel');if(panel)panel.innerHTML=memoryToolContent();updateMemory();}
function timeTool(){return '<div class="calc-fields"><label>Nを選択<select data-calc="n">'+options([[10,'10'],[15,'15'],[20,'20'],[25,'25'],[30,'30'],[100,'10²'],[1000,'10³'],[3000,'3×10³'],[10000,'10⁴'],[200000,'2×10⁵'],[1000000,'10⁶']],calcState.n)+'</select></label></div><div id="time-result" aria-live="polite"></div><p>計算式にNを入れた目安です。実際の処理回数や実行秒数とは異なり、処理内容や定数倍で実行時間は変わります。</p>';}
const superscript=n=>String(n).replace(/[0-9-]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(c)]||'⁻');
function scientificLog(log){if(log===0)return '1';let exponent=Math.floor(log),mantissa=Number((10**(log-exponent)).toPrecision(3));if(mantissa>=10){mantissa=1;exponent++;}return mantissa+'×10'+superscript(exponent);}
function updateTools(){
    updateMemory();
    const time=$('#time-result');
    if(time){const n=Number(calcState.n),l=Math.log10(n);let fact=n<101?Array.from({length:n},(_,i)=>Math.log10(i+1)).reduce((a,b)=>a+b,0):(n+.5)*Math.log10(n)-n*Math.LOG10E+.5*Math.log10(2*Math.PI)+Math.LOG10E/(12*n);const values=[['N',l],['N log₂ N',l+Math.log10(Math.log2(n))],['N²',2*l],['N³',3*l],['2ᴺ',n*Math.log10(2)],['N × 2ᴺ',l+n*Math.log10(2)],['N!',fact]];time.innerHTML='<div class="table-wrap"><table><thead><tr><th>計算式</th><th>計算回数</th></tr></thead><tbody>'+values.map(([name,value])=>'<tr><td>'+name+'</td><td>'+scientificLog(value)+' 回</td></tr>').join('')+'</tbody></table></div>';}
}
for(const event of ['input','change'])document.addEventListener(event,e=>{const k=e.target.dataset.calc;if(!k)return;if(event==='input'&&e.target.tagName==='SELECT'||event==='change'&&e.target.tagName==='INPUT')return;calcState[k]=e.target.value;if(k==='kind')refreshMemory();else updateTools();});
document.addEventListener('click',e=>{const button=e.target.closest('[data-dimension]');if(button){calcState.dimension=button.dataset.dimension;refreshMemory();}});

let openGroup=null;
let mobileIndexOpen=true;
const isMobile=()=>matchMedia("(max-width:750px)").matches;
function librarySection(g,i){return '<section class="section" id="'+i.id+'"><h2>'+esc(i.desc)+'</h2>'+operation(i,false)+'</section>';}
function limitSection(s){return '<section class="section limits" id="'+s.key+'"><h2>'+esc(s.title)+'</h2>'+ (s.tool==='time'?timeTool():s.tool==='memory'?memoryTool():s.content)+'</section>';}
function render(){
    query=$('#search').value.trim();const searching=!!query;
    document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});
    const rows=[];
    for(const g of DATA.groups){
        if(!searching&&g.page!==page)continue;
        const items=g.items.filter(i=>!searching||termsMatch(g.title+' '+(g.keywords||'')+' '+(i.keywords||'')+' '+i.desc+' '+i.code+' '+i.note));
        if(g.page==='algo'){
            if(items.length)rows.push({key:g.key,title:g.title,page:g.page,html:section(g,items),label:'五十音順'});
        }else for(const i of items)rows.push({key:i.id,title:i.desc,page:g.page,group:g.key,groupTitle:g.title,html:librarySection(g,i),label:g.page==='acl'?'AtCoder Library':DATA.groups.findIndex(x=>x.key===g.key)<7?'容器・データを持つもの':'操作関数'});
    }
    if(searching||page==='limits')for(const s of DATA.limits)if(!searching||termsMatch(s.title+' '+s.content.replace(/<[^>]*>/g,' ')))rows.push({key:s.key,title:s.title,page:'limits',html:limitSection(s),label:'計算量・メモリ',tool:!!s.tool});
    if(searching||page==='notes')for(const n of DATA.notes||[])if(!searching||termsMatch(n.title+' '+n.category+' '+n.text+' '+n.at))rows.push({key:n.id,title:n.title,page:'notes',html:noteSection(n),label:n.kind==='updates'?'更新履歴':'制作者メモ'});
    const chosen=rows.find(r=>'#'+r.page+'/'+r.key===selectedTocHref);
    selectedTocHref=chosen?'#'+chosen.page+'/'+chosen.key:'';
    if(openGroup===null)openGroup=chosen?.group||'';
    const tools=rows.filter(r=>r.tool);
    let sideHTML=tools.length?'<div class="toc-tools" aria-label="計算機">'+tools.sort((a,b)=>a.key==='memory-calculator'?-1:b.key==='memory-calculator'?1:0).map(r=>'<a class="side-link" href="#'+r.page+'/'+r.key+'">'+esc(r.title)+'</a>').join('')+'</div>':'',label='',currentGroup='';
    for(const r of rows.filter(r=>!r.tool)){
        if(r.label!==label){if(currentGroup){sideHTML+='</details>';currentGroup='';}sideHTML+='<div class="side-label">'+esc(r.label)+'</div>';label=r.label;}
        if((r.group||'')!==currentGroup){if(currentGroup)sideHTML+='</details>';currentGroup=r.group||'';if(currentGroup)sideHTML+='<details class="toc-group" data-group="'+currentGroup+'"'+(openGroup===currentGroup?' open':'')+'><summary>'+esc(r.groupTitle)+'</summary>';}
        sideHTML+='<a class="side-link" href="#'+r.page+'/'+r.key+'">'+esc(r.title)+'</a>';
    }
    if(currentGroup)sideHTML+='</details>';
    $('#sidebar').innerHTML=sideHTML;
    $('#main').innerHTML='<details class="mobile-index"'+(mobileIndexOpen?' open':'')+'><summary>このページの目次</summary><div>'+sideHTML+'</div></details>'+(chosen?.html||'<div class="empty">'+(rows.length?'目次から項目を選んでください。':'該当する項目がありません。検索語を短くしてください。')+'</div>')+sourceNote();
    syncTocHighlight();updateTools();
}
function jumpFromHash(){
    const [p,key]=decodeURIComponent(location.hash.slice(1)).split('/');
    if(DATA.pages[p]){page=p;}
    const g=DATA.groups.find(g=>g.page===page&&(g.key===key||g.items.some(i=>i.id===key)));
    const target=g&&g.page!=='algo'?(g.key===key?undefined:key):key;
    openGroup=g&&g.page!=='algo'?g.key:isMobile()&&!target?'':null;
    mobileIndexOpen=!target;
    selectedTocHref=target?'#'+page+'/'+target:'';
    render();
    const content=$('main>.section');
    const top=isMobile()&&target&&content?window.scrollY+content.getBoundingClientRect().top-$('header').getBoundingClientRect().height-12:0;
    window.scrollTo({top:Math.max(0,top),left:0,behavior:'instant'});
}
document.addEventListener('click',e=>{
    const outer=e.target.closest('.mobile-index>summary');if(outer){e.preventDefault();mobileIndexOpen=!outer.parentElement.open;outer.parentElement.open=mobileIndexOpen;return;}
    const summary=e.target.closest('.toc-group>summary');if(summary){e.preventDefault();const top=summary.getBoundingClientRect().top;const key=summary.parentElement.dataset.group;openGroup=openGroup===key?'':key;document.querySelectorAll('.toc-group').forEach(g=>{g.open=g.dataset.group===openGroup;});if(isMobile())requestAnimationFrame(()=>{window.scrollBy({top:summary.getBoundingClientRect().top-top,behavior:'instant'});});return;}
    const link=e.target.closest('.side-link');
    if(!link||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey){return;}
    e.preventDefault();
    selectedTocHref=link.getAttribute('href');
    if(location.hash!==selectedTocHref){history.pushState(null,'',selectedTocHref);}
    jumpFromHash();syncTocHighlight();
});
$('#search').addEventListener('input',()=>{clearTocHighlight();render();});
$('#clear').addEventListener('click',()=>{clearTocHighlight();$('#search').value='';query='';render();$('#search').focus();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{clearTocHighlight();page=b.dataset.page;openGroup=isMobile()?'':null;mobileIndexOpen=true;$('#search').value='';query='';history.replaceState(null,'','#'+page);render();window.scrollTo(0,0);}));
document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render();$('#search').blur();}});
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy],[data-shortcopy]');if(copy){const short=!!copy.dataset.shortcopy;const item=entries.get(copy.dataset.shortcopy||copy.dataset.copy);const code=short?item.code:item.full;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code);}else{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();const success=document.execCommand('copy');ta.remove();if(!success)throw Error('copy');}notify(short?'短いコードをコピーしました':'全体コードをコピーしました');}catch{notify('コピーできませんでした。.cppを保存するか、コードを選択してください');}}
const dl=e.target.closest('[data-download]');if(dl){const item=entries.get(dl.dataset.download);const url=URL.createObjectURL(new Blob([item.full],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=item.id+'.cpp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
let lastStandardTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function applyTheme(theme){
    document.documentElement.dataset.theme=theme;
    $('#poison').setAttribute('aria-pressed',String(theme==='poison'));
    if(theme!=='poison'){lastStandardTheme=theme;}
    try{
        localStorage.setItem('cpp-reference-theme',theme);
        localStorage.setItem('cpp-reference-standard-theme',lastStandardTheme);
    }catch{}
}
$('#theme').addEventListener('click',()=>{applyTheme(lastStandardTheme==='dark'?'light':'dark');});
$('#poison').addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme==='poison'?lastStandardTheme:'poison');});
let initialTheme=lastStandardTheme;
try{
    const standard=localStorage.getItem('cpp-reference-standard-theme');
    if(['light','dark'].includes(standard)){lastStandardTheme=standard;}
    const stored=localStorage.getItem('cpp-reference-theme');
    if(['light','dark','poison'].includes(stored)){initialTheme=stored;}
}catch{}
applyTheme(initialTheme);
window.addEventListener('hashchange',jumpFromHash);render();jumpFromHash();
</script>
</body>
</html>
