<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="C++標準ライブラリ・AtCoder Library・定番アルゴリズム・計算量とメモリの参照資料">
<title>C++ 競プロリファレンス</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#202c38;--muted:#65727f;--line:#dfe5eb;--accent:#087c72;--tint:#e9f5f2;--code:#f2f5f8;--header:rgba(247,248,250,.97);color-scheme:light}
:root[data-theme=dark]{--bg:#151b22;--paper:#1c242d;--ink:#e5ebf2;--muted:#a7b3c1;--line:#35414e;--accent:#73d9c4;--tint:#233e3c;--code:#131a22;--header:rgba(21,27,34,.97);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:160px}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.7 system-ui,-apple-system,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif}button,input{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{color:inherit}code,pre{font-family:Consolas,"SFMono-Regular",monospace}header{position:sticky;top:0;z-index:5;background:var(--header);border-bottom:1px solid var(--line)}.topbar{max-width:1560px;margin:auto;padding:15px 30px;display:flex;align-items:center;gap:24px}.brand{font-weight:750;letter-spacing:-.5px;font-size:18px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:600}.search-wrap{flex:1;max-width:650px;position:relative}.search-wrap input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 68px 10px 14px;color:var(--ink)}.clear{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);padding:4px 8px}.source-link{font-size:12px;margin-left:auto;white-space:nowrap}.theme{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px}.tabs{max-width:1560px;margin:auto;display:flex;padding:0 30px;gap:22px;overflow-x:auto}.tab{background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 0 12px;color:var(--muted);font-weight:650}.tab.active{border-bottom-color:var(--accent);color:var(--accent)}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);max-width:1560px;margin:auto;min-height:calc(100vh - 135px)}aside{position:sticky;top:135px;height:calc(100vh - 135px);overflow:auto;padding:26px 18px 60px 30px;border-right:1px solid var(--line)}.side-label{font-size:10px;font-weight:750;color:var(--muted);letter-spacing:1.8px;margin:18px 0 8px}.side-label:first-child{margin-top:0}.side-link{display:block;font-size:12px;padding:7px 9px;border-radius:5px;color:var(--muted);text-decoration:none;line-height:1.5;margin:2px 0}.side-link:hover,.side-link.current{background:var(--tint);color:var(--accent)}main{padding:36px 34px 80px;min-width:0;max-width:1280px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:2px;color:var(--accent);margin:0 0 6px}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px;line-height:1.35}.subtitle{color:var(--muted);margin:0 0 17px}.guide{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 25px}.badge{font-size:11px;background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:4px;color:var(--muted)}.page-heading{margin-bottom:26px}.count{font-size:12px;color:var(--muted)}.section{scroll-margin-top:155px;margin:0 0 32px}.section h2{font-size:17px;line-height:1.6;letter-spacing:-.2px;margin:0;padding:0 0 11px;border-bottom:2px solid var(--line)}.section h2 a{float:right;color:var(--muted);font-size:12px;text-decoration:none;font-weight:400}.section-note{font-size:12px;color:var(--muted);margin:11px 0 16px}.column-head,.op-row{display:grid;grid-template-columns:minmax(190px,.88fr) minmax(250px,1.45fr) minmax(95px,.38fr) 82px;gap:18px;align-items:start}.column-head{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;padding:10px 15px;background:var(--bg);border-bottom:1px solid var(--line)}.operations{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--paper)}details.op{border-bottom:1px solid var(--line)}details.op:last-child{border:0}.op-row{padding:16px 15px;list-style:none;cursor:pointer}.op-row::-webkit-details-marker{display:none}.op-row:hover{background:var(--tint)}.op[open]>.op-row{background:var(--tint)}.desc{font-size:13px;font-weight:550}.index-word{font-size:1.2em;font-weight:850;color:var(--accent);border-bottom:2px solid var(--accent)}.short{font-size:12px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;display:block}.cost{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.expand{font-size:10px;color:var(--accent);text-align:right;white-space:nowrap;padding-top:2px}.expand:after{content:' ＋';font-weight:750}.op[open] .expand:after{content:' −'}.row-note{display:block;color:var(--muted);font-size:11px;line-height:1.6;font-weight:400;margin-top:6px}.full-code{border-top:1px solid var(--line);padding:14px;background:var(--code)}.code-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:9px}.code-actions{display:flex;gap:8px}.copy,.download{border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-size:11px;padding:5px 9px;text-decoration:none}.copy:hover,.download:hover{border-color:var(--accent);color:var(--accent)}pre{font-size:12px;line-height:1.75;margin:0;overflow:auto;tab-size:4;color:var(--ink)}.algo .column-head,.algo .op-row{grid-template-columns:minmax(180px,1fr) minmax(160px,.65fr) 82px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:15px 0;background:var(--paper)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:650;color:var(--muted);background:var(--code);white-space:nowrap}tr:last-child td{border-bottom:0}.note{font-size:12px;color:var(--muted)}.limits p{font-size:12px}.code-only{border:1px solid var(--line);background:var(--paper);border-radius:6px}.code-only summary{cursor:pointer;padding:12px}.code-only pre{padding:15px;background:var(--code)}.empty{padding:60px 15px;text-align:center;color:var(--muted)}footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:7px;padding:10px 18px;font-size:12px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.search-scope{font-size:11px;color:var(--accent);margin:4px 0 20px}.mobile-index{display:none}.hidden{display:none!important}
@media(min-width:1450px){main{padding-left:42px;padding-right:42px}.column-head,.op-row{grid-template-columns:minmax(190px,.9fr) minmax(300px,1.6fr) minmax(95px,.4fr) 82px}}
@media(max-width:1100px){.layout{grid-template-columns:215px minmax(0,1fr)}aside{padding-left:18px}main{padding:28px 22px}.column-head,.op-row{grid-template-columns:minmax(140px,.8fr) minmax(180px,1fr) 82px}.cost{grid-column:2}.expand{grid-column:3;grid-row:1}.desc{grid-row:1/3}.short{grid-column:2;grid-row:1}.column-head span:nth-child(3){display:none}.column-head span:last-child{grid-column:3}.algo .cost{grid-column:2;grid-row:1}.algo .desc{grid-row:1}.algo .column-head span:nth-child(2){display:block}}
@media(max-width:750px){.topbar{padding:12px 16px;gap:12px;flex-wrap:wrap}.brand{font-size:16px}.brand small{display:none}.search-wrap{order:3;flex-basis:100%;max-width:none}.source-link{margin-left:auto}.tabs{padding:0 16px;gap:20px;font-size:12px}.layout{display:block}aside{display:none}main{padding:25px 16px 60px}h1{font-size:24px}.column-head{display:none}.op-row,.algo .op-row{grid-template-columns:minmax(0,1fr) 85px;gap:8px 10px;padding:14px}.desc{grid-column:1;grid-row:1}.expand,.algo .expand{grid-column:2;grid-row:1}.short{grid-column:1/3;grid-row:2;background:var(--code);padding:8px;border-radius:4px}.cost,.algo .cost{grid-column:1/3;grid-row:3}.algo .desc{grid-column:1;grid-row:1}.algo .cost{grid-row:2}.mobile-index{display:block;margin:18px 0;border:1px solid var(--line);border-radius:6px;background:var(--paper)}.mobile-index summary{padding:10px;cursor:pointer}.mobile-index div{padding:0 8px 8px}.code-toolbar{align-items:flex-start}.code-actions{flex-wrap:wrap;justify-content:flex-end}.full-code{padding:10px}.section{scroll-margin-top:190px}html{scroll-padding-top:190px}}
@media print{header,aside,.copy,.download,.expand,.mobile-index{display:none}.layout{display:block}main{padding:0}details.op{break-inside:avoid}pre{white-space:pre-wrap}.op-row{display:block}.short,.cost{margin-top:5px}.full-code{background:white}}
.side-link.current{font-weight:750;box-shadow:inset 3px 0 0 var(--accent),0 0 12px rgba(8,124,114,.18)}
.algorithm-purpose{margin:18px 0 10px;font-size:14px}.algorithm-cost{font-weight:400;font-size:12px;margin:0 0 14px;color:var(--muted)}.algorithm-entry>.full-code{border:1px solid var(--line);border-radius:7px;margin-top:16px}
</style>
</head>
<body>
<header>
<div class="topbar"><div class="brand"><small>CONTEST DESK</small>C++ 競プロリファレンス</div><div class="search-wrap"><input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="全カテゴリから検索" placeholder="reverse、vector、部分反転…　/ で検索"><button type="button" class="clear" id="clear" aria-label="検索を消す">Esc</button></div><a class="source-link" id="source" href="https://github.com/NEZIKI2149/github-test/tree/master/competitive-programming-reference" target="_blank" rel="noopener">GitHub ↗</a><button type="button" class="theme" id="theme" aria-label="配色を切り替える">明 / 暗</button></div>
<nav class="tabs" aria-label="カテゴリ"><button class="tab active" data-page="std" type="button">標準ライブラリ</button><button class="tab" data-page="acl" type="button">AtCoder Library</button><button class="tab" data-page="algo" type="button">定番アルゴリズム・実装</button><button class="tab" data-page="limits" type="button">計算量・メモリ</button></nav>
</header>
<div class="layout"><aside id="sidebar" aria-label="目次"></aside><main id="main"></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script id="reference-data" type="application/json">__REFERENCE_DATA__</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('reference-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emphasize = s => esc(s).replaceAll('添字','<strong class="index-word">添字</strong>');
const entries = new Map(DATA.groups.flatMap(g => g.items.map(i => [i.id,i])));
let page = 'std', timer, query = '';
let selectedTocHref = '';
function syncTocHighlight(){
    document.querySelectorAll('.side-link').forEach(link=>{
        const selected=link.getAttribute('href')===selectedTocHref;
        link.classList.toggle('current',selected);
        if(selected){link.setAttribute('aria-current','location');}
        else{link.removeAttribute('aria-current');}
    });
}
function clearTocHighlight(){
    selectedTocHref='';syncTocHighlight();
}
function notify(message){ $('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200); }
function sourceNote(){return '<footer><a href="'+DATA.source+'" target="_blank" rel="noopener">公開ソース・共通の前提</a> · <a href="https://info.atcoder.jp/entry/llm-rules-ja" target="_blank" rel="noopener">AtCoderの利用ルール</a></footer>';}
function fullCode(i){
    return '<div class="full-code"><div class="code-toolbar"><span>C++23 (GCC 15.2.0) · #include / main() を含む全体コード</span><div class="code-actions"><button type="button" class="copy" data-copy="'+i.id+'">コードをコピー</button><button type="button" class="download" data-download="'+i.id+'">C++ファイルを保存</button></div></div><pre><code>'+esc(i.full)+'</code></pre></div>';
}
function operation(i, algo, groupNote=''){
    if(algo){
        const notes=[groupNote,i.note].filter(Boolean).join(' ');
        return '<article class="algorithm-entry" id="'+i.id+'"><p class="algorithm-purpose"><strong>目的</strong>　'+emphasize(i.desc)+'</p><p class="algorithm-cost">全体の時間 '+esc(i.time)+'　 /　 メモリ '+esc(i.memory)+(i.cost_definition?'　（'+esc(i.cost_definition)+'）':'')+'</p>'+(notes?'<p class="section-note">'+emphasize(notes)+'</p>':'')+fullCode(i)+'</article>';
    }
    return '<details class="op" id="'+i.id+'"><summary class="op-row"><span class="desc">'+emphasize(i.desc)+(i.note?'<span class="row-note">'+emphasize(i.note)+'</span>':'')+'</span><code class="short">'+esc(i.code)+'</code><span class="cost">'+esc(i.cost)+'</span><span class="expand">全体コード</span></summary>'+fullCode(i)+'</details>';
}
function section(g, items){
    const algo=g.page==='algo';
    return '<section class="section '+(algo?'algo':'')+'" id="'+g.key+'"><h2>'+esc(g.title)+'<a href="#'+g.page+'/'+g.key+'" aria-label="この項目のリンク">#</a></h2>'+(g.note&&!algo?'<p class="section-note">'+emphasize(g.note)+'</p>':'')+(algo?'':'<div class="operations"><div class="column-head"><span>機能</span><span>コード</span><span>計算量</span><span>展開</span></div>')+items.map(i=>operation(i,algo,g.note)).join('')+(algo?'':'</div>')+'</section>';
}
function termsMatch(text){const t=text.toLocaleLowerCase();return query.trim().toLocaleLowerCase().split(/\s+/).every(q=>t.includes(q));}
function render(){
    query=$('#search').value.trim(); const searching=!!query;
    document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});
    let sections=[],side=[],total=0;
    if(searching){
        for(const g of DATA.groups){const items=g.items.filter(i=>termsMatch(g.title+' '+g.note+' '+(g.keywords||'')+' '+i.desc+' '+i.code+' '+i.note));if(items.length){sections.push(section(g,items));side.push([g.key,g.title,g.page]);total+=items.length;}}
        for(const s of DATA.limits){if(termsMatch(s.title+' '+s.content.replace(/<[^>]*>/g,' '))){sections.push('<section class="section limits" id="'+s.key+'"><h2>'+s.title+'</h2>'+s.content+'</section>');side.push([s.key,s.title,'limits']);total++;}}
    }else if(page==='limits'){
        sections=DATA.limits.map(s=>'<section class="section limits" id="'+s.key+'"><h2>'+s.title+'</h2>'+s.content+'</section>');side=DATA.limits.map(s=>[s.key,s.title,'limits']);
    }else{
        for(const g of DATA.groups.filter(g=>g.page===page)){sections.push(section(g,g.items));side.push([g.key,g.title,g.page]);total+=g.items.length;}
    }
    // 目次には候補を残し、本文のDOMには選択した1項目だけを置く。
    let selectedIndex=side.findIndex(([key,title,p])=>'#'+p+'/'+key===selectedTocHref);
    if(selectedIndex<0&&side.length){selectedIndex=0;}
    selectedTocHref=selectedIndex<0?'':'#'+side[selectedIndex][2]+'/'+side[selectedIndex][0];
    const selectedContent=selectedIndex<0?'':sections[selectedIndex];
    const selectedKey=selectedIndex<0?'':side[selectedIndex][0];
    let sideHTML='';let label='';
    for(const [key,title,p] of side){let next=p==='std'?(DATA.groups.findIndex(g=>g.key===key)<7?'容器・データを持つもの':'操作関数'):DATA.pages[p].title;if(next!==label){sideHTML+='<div class="side-label">'+esc(next)+'</div>';label=next;}sideHTML+='<a class="side-link" href="#'+p+'/'+key+'">'+esc(title)+'</a>';}
    $('#sidebar').innerHTML=sideHTML;
    $('#main').innerHTML='<details class="mobile-index"><summary>このページの目次</summary><div>'+sideHTML+'</div></details>'+(selectedContent||'<div class="empty">該当する項目がありません。検索語を短くしてください。</div>')+sourceNote();
    syncTocHighlight();
}
function jumpFromHash(){
    const [p,key]=decodeURIComponent(location.hash.slice(1)).split('/');
    if(DATA.pages[p]){page=p;}
    selectedTocHref=key?'#'+page+'/'+key:'';
    render();
    window.scrollTo({top:0,left:0,behavior:'instant'});
}
document.addEventListener('click',e=>{
    const link=e.target.closest('.side-link');
    if(!link||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey){return;}
    e.preventDefault();
    selectedTocHref=link.getAttribute('href');
    if(location.hash!==selectedTocHref){history.pushState(null,'',selectedTocHref);}
    jumpFromHash();syncTocHighlight();
});
$('#search').addEventListener('input',()=>{clearTocHighlight();render();});
$('#clear').addEventListener('click',()=>{clearTocHighlight();$('#search').value='';query='';render();$('#search').focus();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{clearTocHighlight();page=b.dataset.page;$('#search').value='';query='';history.replaceState(null,'','#'+page);render();window.scrollTo(0,0);}));
document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render();$('#search').blur();}});
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){const code=entries.get(copy.dataset.copy).full;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code);}else{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();const success=document.execCommand('copy');ta.remove();if(!success)throw Error('copy');}notify('全体コードをコピーしました');}catch{notify('コピーできませんでした。.cppを保存するか、コードを選択してください');}}
const dl=e.target.closest('[data-download]');if(dl){const item=entries.get(dl.dataset.download);const url=URL.createObjectURL(new Blob([item.full],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=item.id+'.cpp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
$('#theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('cpp-reference-theme',theme);}catch{}});
try{document.documentElement.dataset.theme=localStorage.getItem('cpp-reference-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch{}
window.addEventListener('hashchange',jumpFromHash);render();jumpFromHash();
</script>
</body>
</html>
