<script>
'use strict';
const DATA = JSON.parse(document.getElementById('reference-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entries = new Map(DATA.groups.flatMap(g => g.items.map(i => [i.id,i])));
let page = 'std', timer, query = '';
let selectedTocHref = '';
function syncTocHighlight(){
    document.querySelectorAll('.side-link').forEach(link=>{
        const selected=link.getAttribute('href')===selectedTocHref;
        link.classList.toggle('current',selected);
        if(selected){link.setAttribute('aria-current','location');}
        else{link.removeAttribute('aria-current');}
    });
}
function clearTocHighlight(){
    selectedTocHref='';syncTocHighlight();
}
function notify(message){ $('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200); }
function sourceNote(){return '<footer><a href="'+DATA.source+'" target="_blank" rel="noopener">公開ソース・共通の前提</a> · <a href="https://info.atcoder.jp/entry/llm-rules-ja" target="_blank" rel="noopener">AtCoderの利用ルール</a></footer>';}
function fullCode(i){
    return '<div class="full-code"><div class="code-toolbar"><span>C++23 (GCC 15.2.0) · #include / main() を含む全体コード</span><div class="code-actions"><button type="button" class="copy" data-copy="'+i.id+'">全体コードをコピー</button><button type="button" class="download" data-download="'+i.id+'">C++ファイルを保存</button></div></div><pre><code>'+esc(i.full)+'</code></pre></div>';
}
function operation(i, algo, groupNote=''){
    if(algo){
        const notes=[groupNote,i.note].filter(Boolean).join(' ');
        return '<article class="algorithm-entry" id="'+i.id+'"><p class="algorithm-purpose"><strong>目的</strong> : '+esc(i.desc)+'</p><p class="algorithm-cost">計算量 '+esc(i.time)+'　 /　 メモリ '+esc(i.memory)+(i.cost_definition?'　（'+esc(i.cost_definition)+'）':'')+'</p>'+(notes?'<p class="section-note">'+esc(notes)+'</p>':'')+fullCode(i)+'</article>';
    }
    return '<article class="operation-entry" id="'+i.id+'-operation"><p class="algorithm-purpose">機能 : '+esc(i.desc)+'</p><div class="operation-short"><pre><code>'+esc(i.code)+'</code></pre><div class="code-actions"><button type="button" class="copy" data-shortcopy="'+i.id+'">この部分をコピー</button></div></div><p class="operation-cost">計算量 '+esc(i.cost)+'　 /　 追加メモリ '+esc(i.memory)+'</p>'+(i.definitions?'<p class="symbol-definitions">'+esc(i.definitions)+'</p>':'')+(i.note?'<p class="section-note">'+esc(i.note)+'</p>':'')+(i.example?'<pre class="operation-example">'+esc(i.example)+'</pre>':'')+fullCode(i)+'</article>';
}
function section(g, items){
    const algo=g.page==='algo';
    return '<section class="section '+(algo?'algo':'')+'" id="'+g.key+'"><h2>'+esc(g.title)+'<a href="#'+g.page+'/'+g.key+'" aria-label="この項目のリンク">#</a></h2>'+(g.note&&!algo?'<p class="section-note">'+esc(g.note)+'</p>':'')+(algo?'':'<div class="operations"><div class="column-head"><span>機能</span><span>コード</span><span>計算量</span><span>展開</span></div>')+items.map(i=>operation(i,algo,g.note)).join('')+(algo?'':'</div>')+'</section>';
}
function noteSection(n){return '<section class="section" id="'+esc(n.id)+'"><h2>'+esc(n.title)+'</h2><p class="section-note">'+esc(n.at)+' JST　 /　 '+esc(n.category)+'</p><p>'+esc(n.text)+'</p></section>';}
function termsMatch(text){const t=text.toLocaleLowerCase();return query.trim().toLocaleLowerCase().split(/\s+/).every(q=>t.includes(q));}
const calcState={kind:'',dimension:'1',type:'int',keyType:'int',valueType:'int',size:'100000',rows:'2000',cols:'3000',count:'1',limit:'1024',n:'200000'};
const memoryTypes={char:{label:'char',bytes:1n,align:1n},int:{label:'int',bytes:4n,align:4n},longlong:{label:'long long',bytes:8n,align:8n},double:{label:'double',bytes:8n,align:8n}};
const memoryKinds=[['','選択してください'],['vector','配列（vector）'],['set','set'],['multiset','multiset'],['map','map'],['unordered_set','unordered_set'],['unordered_map','unordered_map']];
function options(values,current){return values.map(([v,t])=>'<option value="'+v+'"'+(String(v)===current?' selected':'')+'>'+t+'</option>').join('');}
function memoryField(key,label){return '<label>'+label+'<input data-calc="'+key+'" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" value="'+esc(calcState[key])+'"></label>';}
function memoryTypeField(key,label){return '<label>'+label+'<select data-calc="'+key+'">'+options(Object.entries(memoryTypes).map(([k,t])=>[k,t.label]),calcState[key])+'</select></label>';}
function memoryToolContent(){
    const array=calcState.kind==='vector',map=calcState.kind.endsWith('map');
    const selector='<div class="calc-fields"><label>コンテナ<select data-calc="kind">'+options(memoryKinds,calcState.kind)+'</select></label></div>';
    if(!calcState.kind)return selector;
    return selector+(array?'<div class="dimension-controls" role="group" aria-label="配列の次元">'+[['1','一次元配列'],['2','二次元配列']].map(([k,t])=>'<button type="button" class="copy" data-dimension="'+k+'" aria-pressed="'+(calcState.dimension===k)+'">'+t+'</button>').join('')+'</div>':'')+'<div class="calc-fields">'+(map?memoryTypeField('keyType','キーの型')+memoryTypeField('valueType','値の型'):memoryTypeField('type','値の型'))+(array&&calcState.dimension==='2'?memoryField('rows','行数')+memoryField('cols','列数'):memoryField('size',map||calcState.kind==='set'||calcState.kind==='unordered_set'?'要素数（異なるキー・値の個数）':'要素数'))+memoryField('count',array?'配列の個数':'コンテナの個数')+'<label>問題のメモリ制限<select data-calc="limit">'+options([256,512,1024,2048].map(v=>[v,v+' MB']),calcState.limit)+'</select></label></div><div class="calc-output" id="memory-result" aria-live="polite"></div><div id="memory-assumptions"></div><p>メモリ制限は問題文を確認して選択してください。</p>';
}
function memoryTool(){return '<div id="memory-panel">'+memoryToolContent()+'</div>';}
const alignBytes=(v,a)=>(v+a-1n)/a*a;
const allocationBytes=v=>{const n=alignBytes(v+8n,16n);return n<32n?32n:n;};
function memoryEstimate(state){
    if(!state.kind||!memoryKinds.some(([kind])=>kind===state.kind))return {unselected:true};
    const array=state.kind==='vector',map=state.kind.endsWith('map'),two=array&&state.dimension==='2';
    const keys=two?['rows','cols','count']:['size','count'];
    if(keys.some(k=>!/^\d{1,12}$/.test(state[k])||BigInt(state[k])<1n))return {error:'要素数・行数・列数・個数には、1以上の整数を入力してください。'};
    const copies=BigInt(state.count),rows=two?BigInt(state.rows):1n,n=two?rows*BigInt(state.cols):BigInt(state.size);
    let value=memoryTypes[state.type].bytes;
    if(map){const k=memoryTypes[state.keyType],v=memoryTypes[state.valueType];value=alignBytes(alignBytes(k.bytes,v.align)+v.bytes,k.align>v.align?k.align:v.align);}
    const payload=n*value*copies;
    let low=payload,high=payload,assumption='要素本体の容量。ほかの変数や実行環境の使用量は含まない。';
    if(state.kind==='vector'){
        const valueBytes=memoryTypes[state.type].bytes;
        const base=two?24n+allocationBytes(rows*24n)+rows*allocationBytes(BigInt(state.cols)*valueBytes):24n+allocationBytes(n*valueBytes);
        low=base*copies;high=(base+16n*(two?rows+1n:1n))*copies;
        assumption='capacityを要素数ちょうどにしたvectorを想定。二次元はvector<vector<T>>として各行の管理領域も計算。push_backなどで余分な容量を確保した場合は、この値より増える。';
    }else if(state.kind==='set'||state.kind==='multiset'||state.kind==='map'){
        const node=alignBytes(32n+value,8n);
        low=(allocationBytes(node)*n+48n)*copies;high=((allocationBytes(node)+16n)*n+48n)*copies;
        assumption='各要素に木の管理情報を持つGCCの一般的な実装を想定。要素数はset・mapでは重複を除いた個数、multisetでは重複も数える。';
    }else if(state.kind.startsWith('unordered_')){
        const node=alignBytes(8n+value,8n);
        low=(allocationBytes(node)*n+allocationBytes(8n*n)+56n)*copies;high=((allocationBytes(node)+16n)*n+allocationBytes(16n*n)+16n+56n)*copies;
        assumption='標準のハッシュ関数を使い、バケット数を要素数の約1〜2倍として見積もる。reserve・rehash・max_load_factorの設定や再確保の途中では、この範囲から外れることがある。';
    }
    return {payload,low,high,estimated:true,assumption};
}
function memoryBytes(n){return (Number(n)/1e6).toLocaleString('ja-JP',{maximumSignificantDigits:5})+' MB';}
function updateMemory(){
    const result=$('#memory-result');if(!result)return;
    const estimate=memoryEstimate(calcState),help=$('#memory-assumptions');
    if(estimate.unselected){result.textContent='';if(help)help.textContent='';return;}
    if(estimate.error){result.textContent=estimate.error;if(help)help.textContent='';return;}
    const {payload,low,high,estimated,assumption}=estimate,limit=BigInt(calcState.limit)*1000000n;
    const percent=n=>(Number(n)/Number(limit)*100).toLocaleString('ja-JP',{maximumSignificantDigits:4});
    result.innerHTML='使用メモリ量 : '+memoryBytes(high)+' / '+calcState.limit+' MB<br>制限に対する割合 : 約'+percent(high)+'％';
    if(help)help.innerHTML=(high>limit?'<p>推定使用メモリ量がメモリ制限を超えています。</p>':'')+'<p>'+esc(assumption)+'</p>'+(estimated?'<p>64 bit Linux・GCC系の一般的な実装での概算。使用メモリ量と割合には、大きい方の推定値を使っています。実測値や絶対的な上限ではありません。確保処理の管理分や配置の隙間も考慮しているが、ほかの変数・再確保中の一時領域などは別に必要。</p><details><summary>見積もりの前提</summary><p>参照やノードの管理情報、mapのキーと値の間の隙間、メモリ確保の最小単位や管理分を考慮したモデルです。確保処理の違いを見込み、大きい方の推定値を採用しています。</p><p><a href="https://gcc.gnu.org/onlinedocs/gcc-15.2.0/libstdc%2B%2B/api/a00413_source.html" target="_blank" rel="noopener">GCCの木構造の実装</a> · <a href="https://gcc.gnu.org/onlinedocs/gcc-15.2.0/libstdc%2B%2B/api/a18194_source.html" target="_blank" rel="noopener">ハッシュ表の実装</a> · <a href="https://github.com/bminor/glibc/blob/master/malloc/malloc.c" target="_blank" rel="noopener">メモリ確保処理の実装</a></p></details>':'');
}
function refreshMemory(){const panel=$('#memory-panel');if(panel)panel.innerHTML=memoryToolContent();updateMemory();}
function timeTool(){return '<div class="calc-fields"><label>Nを選択<select data-calc="n">'+options([[10,'10'],[15,'15'],[20,'20'],[25,'25'],[30,'30'],[100,'10²'],[1000,'10³'],[3000,'3×10³'],[10000,'10⁴'],[200000,'2×10⁵'],[1000000,'10⁶']],calcState.n)+'</select></label></div><div id="time-result" aria-live="polite"></div><p>計算式にNを入れた目安です。実際の処理回数や実行秒数とは異なり、処理内容や定数倍で実行時間は変わります。</p>';}
const superscript=n=>String(n).replace(/[0-9-]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(c)]||'⁻');
function scientificLog(log){if(log===0)return '1';let exponent=Math.floor(log),mantissa=Number((10**(log-exponent)).toPrecision(3));if(mantissa>=10){mantissa=1;exponent++;}return mantissa+'×10'+superscript(exponent);}
function updateTools(){
    updateMemory();
    const time=$('#time-result');
    if(time){const n=Number(calcState.n),l=Math.log10(n);let fact=n<101?Array.from({length:n},(_,i)=>Math.log10(i+1)).reduce((a,b)=>a+b,0):(n+.5)*Math.log10(n)-n*Math.LOG10E+.5*Math.log10(2*Math.PI)+Math.LOG10E/(12*n);const values=[['N',l],['N log₂ N',l+Math.log10(Math.log2(n))],['N²',2*l],['N³',3*l],['2ᴺ',n*Math.log10(2)],['N × 2ᴺ',l+n*Math.log10(2)],['N!',fact]];time.innerHTML='<div class="table-wrap"><table><thead><tr><th>計算式</th><th>計算回数</th></tr></thead><tbody>'+values.map(([name,value])=>'<tr><td>'+name+'</td><td>'+scientificLog(value)+' 回</td></tr>').join('')+'</tbody></table></div>';}
}
for(const event of ['input','change'])document.addEventListener(event,e=>{const k=e.target.dataset.calc;if(!k)return;if(event==='input'&&e.target.tagName==='SELECT'||event==='change'&&e.target.tagName==='INPUT')return;calcState[k]=e.target.value;if(k==='kind')refreshMemory();else updateTools();});
document.addEventListener('click',e=>{const button=e.target.closest('[data-dimension]');if(button){calcState.dimension=button.dataset.dimension;refreshMemory();}});

let openGroup=null;
let mobileIndexOpen=true;
const isMobile=()=>matchMedia("(max-width:750px)").matches;
function librarySection(g,i){return '<section class="section" id="'+i.id+'"><h2>'+esc(i.desc)+'</h2>'+operation(i,false)+'</section>';}
function limitSection(s){return '<section class="section limits" id="'+s.key+'"><h2>'+esc(s.title)+'</h2>'+ (s.tool==='time'?timeTool():s.tool==='memory'?memoryTool():s.content)+'</section>';}
function render(){
    query=$('#search').value.trim();const searching=!!query;
    document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});
    const rows=[];
    for(const g of DATA.groups){
        if(!searching&&g.page!==page)continue;
        const items=g.items.filter(i=>!searching||termsMatch(g.title+' '+(g.keywords||'')+' '+(i.keywords||'')+' '+i.desc+' '+i.code+' '+i.note));
        if(g.page==='algo'){
            if(items.length)rows.push({key:g.key,title:g.title,page:g.page,html:section(g,items),label:'五十音順'});
        }else for(const i of items)rows.push({key:i.id,title:i.desc,page:g.page,group:g.key,groupTitle:g.title,html:librarySection(g,i),label:g.page==='acl'?'AtCoder Library':DATA.groups.findIndex(x=>x.key===g.key)<7?'容器・データを持つもの':'操作関数'});
    }
    if(searching||page==='limits')for(const s of DATA.limits)if(!searching||termsMatch(s.title+' '+s.content.replace(/<[^>]*>/g,' ')))rows.push({key:s.key,title:s.title,page:'limits',html:limitSection(s),label:'計算量・メモリ',tool:!!s.tool});
    if(searching||page==='notes')for(const n of DATA.notes||[])if(!searching||termsMatch(n.title+' '+n.category+' '+n.text+' '+n.at))rows.push({key:n.id,title:n.title,page:'notes',html:noteSection(n),label:n.kind==='updates'?'更新履歴':'制作者メモ'});
    const chosen=rows.find(r=>'#'+r.page+'/'+r.key===selectedTocHref);
    selectedTocHref=chosen?'#'+chosen.page+'/'+chosen.key:'';
    if(openGroup===null)openGroup=chosen?.group||'';
    const tools=rows.filter(r=>r.tool);
    let sideHTML=tools.length?'<div class="toc-tools" aria-label="計算機">'+tools.sort((a,b)=>a.key==='memory-calculator'?-1:b.key==='memory-calculator'?1:0).map(r=>'<a class="side-link" href="#'+r.page+'/'+r.key+'">'+esc(r.title)+'</a>').join('')+'</div>':'',label='',currentGroup='';
    for(const r of rows.filter(r=>!r.tool)){
        if(r.label!==label){if(currentGroup){sideHTML+='</details>';currentGroup='';}sideHTML+='<div class="side-label">'+esc(r.label)+'</div>';label=r.label;}
        if((r.group||'')!==currentGroup){if(currentGroup)sideHTML+='</details>';currentGroup=r.group||'';if(currentGroup)sideHTML+='<details class="toc-group" data-group="'+currentGroup+'"'+(openGroup===currentGroup?' open':'')+'><summary>'+esc(r.groupTitle)+'</summary>';}
        sideHTML+='<a class="side-link" href="#'+r.page+'/'+r.key+'">'+esc(r.title)+'</a>';
    }
    if(currentGroup)sideHTML+='</details>';
    $('#sidebar').innerHTML=sideHTML;
    $('#main').innerHTML='<details class="mobile-index"'+(mobileIndexOpen?' open':'')+'><summary>このページの目次</summary><div>'+sideHTML+'</div></details>'+(chosen?.html||'<div class="empty">'+(rows.length?'目次から項目を選んでください。':'該当する項目がありません。検索語を短くしてください。')+'</div>')+sourceNote();
    syncTocHighlight();updateTools();
}
function jumpFromHash(){
    const [p,key]=decodeURIComponent(location.hash.slice(1)).split('/');
    if(DATA.pages[p]){page=p;}
    const g=DATA.groups.find(g=>g.page===page&&(g.key===key||g.items.some(i=>i.id===key)));
    const target=g&&g.page!=='algo'?(g.key===key?undefined:key):key;
    openGroup=g&&g.page!=='algo'?g.key:isMobile()&&!target?'':null;
    mobileIndexOpen=!target;
    selectedTocHref=target?'#'+page+'/'+target:'';
    render();
    const content=$('main>.section');
    const top=isMobile()&&target&&content?window.scrollY+content.getBoundingClientRect().top-$('header').getBoundingClientRect().height-12:0;
    window.scrollTo({top:Math.max(0,top),left:0,behavior:'instant'});
}
document.addEventListener('click',e=>{
    const outer=e.target.closest('.mobile-index>summary');if(outer){e.preventDefault();mobileIndexOpen=!outer.parentElement.open;outer.parentElement.open=mobileIndexOpen;return;}
    const summary=e.target.closest('.toc-group>summary');if(summary){e.preventDefault();const top=summary.getBoundingClientRect().top;const key=summary.parentElement.dataset.group;openGroup=openGroup===key?'':key;document.querySelectorAll('.toc-group').forEach(g=>{g.open=g.dataset.group===openGroup;});if(isMobile())requestAnimationFrame(()=>{window.scrollBy({top:summary.getBoundingClientRect().top-top,behavior:'instant'});});return;}
    const link=e.target.closest('.side-link');
    if(!link||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey){return;}
    e.preventDefault();
    selectedTocHref=link.getAttribute('href');
    if(location.hash!==selectedTocHref){history.pushState(null,'',selectedTocHref);}
    jumpFromHash();syncTocHighlight();
});
$('#search').addEventListener('input',()=>{clearTocHighlight();render();});
$('#clear').addEventListener('click',()=>{clearTocHighlight();$('#search').value='';query='';render();$('#search').focus();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{clearTocHighlight();page=b.dataset.page;openGroup=isMobile()?'':null;mobileIndexOpen=true;$('#search').value='';query='';history.replaceState(null,'','#'+page);render();window.scrollTo(0,0);}));
document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render();$('#search').blur();}});
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy],[data-shortcopy]');if(copy){const short=!!copy.dataset.shortcopy;const item=entries.get(copy.dataset.shortcopy||copy.dataset.copy);const code=short?item.code:item.full;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code);}else{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();const success=document.execCommand('copy');ta.remove();if(!success)throw Error('copy');}notify(short?'短いコードをコピーしました':'全体コードをコピーしました');}catch{notify('コピーできませんでした。.cppを保存するか、コードを選択してください');}}
const dl=e.target.closest('[data-download]');if(dl){const item=entries.get(dl.dataset.download);const url=URL.createObjectURL(new Blob([item.full],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=item.id+'.cpp';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
let lastStandardTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function applyTheme(theme){
    document.documentElement.dataset.theme=theme;
    $('#poison').setAttribute('aria-pressed',String(theme==='poison'));
    if(theme!=='poison'){lastStandardTheme=theme;}
    try{
        localStorage.setItem('cpp-reference-theme',theme);
        localStorage.setItem('cpp-reference-standard-theme',lastStandardTheme);
    }catch{}
}
$('#theme').addEventListener('click',()=>{applyTheme(lastStandardTheme==='dark'?'light':'dark');});
$('#poison').addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme==='poison'?lastStandardTheme:'poison');});
let initialTheme=lastStandardTheme;
try{
    const standard=localStorage.getItem('cpp-reference-standard-theme');
    if(['light','dark'].includes(standard)){lastStandardTheme=standard;}
    const stored=localStorage.getItem('cpp-reference-theme');
    if(['light','dark','poison'].includes(stored)){initialTheme=stored;}
}catch{}
applyTheme(initialTheme);
window.addEventListener('hashchange',jumpFromHash);render();jumpFromHash();
</script>
